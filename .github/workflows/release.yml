# Push a version tag (git tag v0.2.0 && git push origin v0.2.0) and this builds the
# Windows installer and attaches it to a GitHub release for that tag.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # The tag is the version: v0.2.0 builds AgentNotch-Setup-0.2.0.exe
      - run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npx electron-builder --win nsis --publish never
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/AgentNotch-Setup-*.exe --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/AgentNotch-Setup-*.exe --title "Agent Notch $GITHUB_REF_NAME" --generate-notes
          fi
