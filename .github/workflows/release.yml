# Push a version tag (git tag v0.2.0 && git push origin v0.2.0) and this builds the
# Windows installer and attaches it to a GitHub release for that tag, together with latest.yml and the blockmap:
# installed copies read those to find, verify and download updates.
# Run it by hand from the Actions tab to build without publishing.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm test
      # The tag is the version: v0.2.0 builds AgentNotch-Setup-0.2.0.exe
      - if: github.ref_type == 'tag'
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npx electron-builder --win nsis --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: |
            dist/AgentNotch-Setup-*.exe
            dist/AgentNotch-Setup-*.exe.blockmap
            dist/latest.yml
      # Mirror on Cloudflare R2: GitHub's release downloads crawl on some networks (a few KB/s in India). The website's
      # button and the updater download from here; latest.yml goes last, so nobody sees a release before its installer.
      - name: Mirror to Cloudflare R2
        if: github.ref_type == 'tag'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          put() { aws s3 cp "$1" "s3://agent-notch/$2" --endpoint-url "$R2" --no-progress "${@:3}"; }
          for f in dist/AgentNotch-Setup-*.exe dist/AgentNotch-Setup-*.exe.blockmap; do put "$f" "$(basename "$f")"; done
          put dist/AgentNotch-Setup-*.exe AgentNotch-Setup.exe --cache-control no-cache
          put dist/latest.yml latest.yml --cache-control no-cache
      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/AgentNotch-Setup-*.exe dist/AgentNotch-Setup-*.exe.blockmap dist/latest.yml --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/AgentNotch-Setup-*.exe dist/AgentNotch-Setup-*.exe.blockmap dist/latest.yml --title "Agent Notch $GITHUB_REF_NAME" --generate-notes
          fi
