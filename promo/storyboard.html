<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Notch Storyboard</title>
<style>
  :root {
    --ink: #000; --ink-alt: #18191A; --line: #262728; --white: #fff; --muted: rgba(235,235,245,.6); --hint: #484C50;
    --blue: #0A84FF; --orange: #FF9F0A; --red: #FF453A; --green: #30D158; --purple: #BF5AF2;
    --display: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    --text: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    --mono: "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: #0b0b0c; color: var(--white); font: 15px/1.5 var(--text); padding: 40px 32px 80px; }
  header { max-width: 1500px; margin: 0 auto 28px; display: flex; flex-wrap: wrap; align-items: end; gap: 12px 24px; }
  header h1 { font: 800 40px/1 var(--display); letter-spacing: -.03em; }
  header h1 small { font: 600 14px var(--mono); color: var(--blue); margin-left: 10px; letter-spacing: 0; vertical-align: middle; }
  header p { color: var(--muted); flex: 1 1 360px; }
  .tag { font: 12px var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 5px 12px; }
  .act { max-width: 1500px; margin: 30px auto 12px; font: 600 12px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); display: flex; gap: 12px; align-items: center; }
  .act::after { content: ''; flex: 1; height: 1px; background: var(--line); }
  .act b { color: var(--orange); } .act.order b { color: var(--blue); }
  .grid { max-width: 1500px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; }
  @media (max-width: 1100px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } body { padding: 24px 16px; } }
  figure { display: flex; flex-direction: column; gap: 8px; }
  .label { display: flex; justify-content: space-between; font: 12px var(--mono); color: var(--muted); letter-spacing: .06em; }
  .label b { color: var(--white); font-weight: 600; }
  figcaption { font-size: 13.5px; color: var(--muted); }
  figcaption strong { color: var(--white); }
  .seam { align-self: start; font: 11px var(--mono); padding: 3px 9px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }

  /* ---------- the 16:9 cell: all sizes in cqw so it matches the 1920x1080 build ---------- */
  .cell { aspect-ratio: 16 / 9; container-type: inline-size; position: relative; overflow: hidden; background: var(--ink); border-radius: 10px; border: 1px solid var(--line); }
  .cell * { position: absolute; }
  .cell .flow, .cell .flow *, .cell .h *, .cell .cap *, .cell .term .body *, .cell .prompt * { position: static; }
  .h { font: 800 6.2cqw/0.95 var(--display); letter-spacing: -.035em; text-transform: lowercase; color: var(--white); }
  .h em { font-style: normal; color: var(--orange); } .h i { font-style: normal; color: var(--blue); }
  .cap { font: 1.5cqw/1.3 var(--text); color: var(--muted); }
  .wall { inset: 0; background: radial-gradient(120% 90% at 30% 20%, #34405e, #1a1f2e 60%, #0d0f16); }
  .shake { filter: saturate(1.3); }
  .grey { filter: grayscale(1) brightness(.45); }

  .term { width: 26cqw; height: 16cqw; background: #0c0c0c; border: .15cqw solid #3a3a3a; border-radius: .6cqw; box-shadow: 0 1cqw 2.5cqw rgba(0,0,0,.6); overflow: hidden; }
  .term .bar { left: 0; right: 0; top: 0; height: 2.1cqw; background: #202020; display: flex; align-items: center; gap: .7cqw; padding: 0 .8cqw; font: 1cqw var(--text); color: #ddd; }
  .term .bar img { position: static; width: 1.2cqw; height: 1.2cqw; }
  .term .body { left: .9cqw; right: .9cqw; top: 2.8cqw; font: .95cqw/1.45 var(--mono); color: #c8c8c8; white-space: pre; }
  .term .body .o { color: var(--orange); } .term .body .r { color: var(--red); } .term .body .b { color: var(--blue); } .term .body .g { color: var(--green); }

  .pill { left: 50%; translate: -50% 0; top: 1.4cqw; height: 3.1cqw; border-radius: 99px; background: #000; border: .12cqw solid rgba(120,140,255,.55);
          box-shadow: 0 0 0 .08cqw rgba(191,90,242,.35), 0 .8cqw 2cqw rgba(0,0,0,.7); display: flex; align-items: center; gap: .9cqw; padding: 0 1.4cqw; font: 600 1.25cqw var(--text); white-space: nowrap; }
  .pill.warn { border-color: rgba(255,159,10,.7); box-shadow: 0 0 2.4cqw rgba(255,159,10,.35); color: var(--orange); }
  .dots { position: relative !important; display: inline-block; width: 4cqw; height: 1.2cqw; }
  .dots i { width: 1.2cqw; height: 1.2cqw; border-radius: 50%; top: 0; border: .15cqw solid #000; }
  .glint { inset: 0; border-radius: 99px; background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.55) 48%, transparent 60%); }

  .prompt { background: #141414; border: .15cqw solid var(--orange); border-radius: .5cqw; padding: .8cqw 1.1cqw; font: 1.1cqw/1.45 var(--mono); color: #eee; white-space: pre; box-shadow: 0 .6cqw 1.6cqw rgba(0,0,0,.6); }
  .prompt .o { color: var(--orange); }
  .badge { background: var(--orange); color: #000; font: 700 1.1cqw var(--text); border-radius: 99px; padding: .3cqw .9cqw; }
  .key { width: 7cqw; height: 7cqw; border-radius: 1.2cqw; background: linear-gradient(#2c2c2e, #1c1c1e); border: .15cqw solid #48484a; box-shadow: 0 .5cqw 0 #0a0a0a, 0 1cqw 2cqw rgba(0,0,0,.5);
         display: grid; place-items: center; font: 700 3.4cqw var(--display); color: #fff; }
  .key.wide { width: auto; height: 3.6cqw; padding: 0 1.4cqw; font-size: 1.5cqw; border-radius: .8cqw; }
  .card { background: #1c1c1e; border-radius: 1.4cqw; }
  .row { display: flex; align-items: center; gap: 1cqw; }
  .tile { width: 2.6cqw; height: 2.6cqw; border-radius: .6cqw; display: grid; place-items: center; }
  .tile img { position: static; width: 1.7cqw; height: 1.7cqw; }
  .switch { width: 3.2cqw; height: 1.9cqw; border-radius: 99px; background: var(--green); }
  .switch::after { content: ''; position: absolute; right: .2cqw; top: .2cqw; width: 1.5cqw; height: 1.5cqw; border-radius: 50%; background: #fff; }
  .track { height: .55cqw; border-radius: 99px; background: rgba(118,118,128,.3); }
  .cell .track i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; }
  .ph { border: .12cqw dashed #555; border-radius: .6cqw; display: grid; place-items: center; color: #777; font: 1cqw var(--mono); }

  /* closing cells */
  .strip { inset: 0; display: flex; align-items: center; padding: 0 2cqw; gap: .6cqw; }
  .strip div { position: relative; flex: 1; height: 26cqw; border-radius: .6cqw; display: flex; flex-direction: column; justify-content: end; padding: .8cqw; font: 1.1cqw/1.3 var(--mono); }
  .strip div b { font: 700 1.6cqw var(--display); }
  .tok { inset: 3cqw; display: grid; grid-template-columns: 1fr 1fr; gap: 1.6cqw 3cqw; align-content: start; }
  .tok > div { position: relative; }
  .tok h4 { font: 600 1.1cqw var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: .7cqw; }
  .sw { display: flex; gap: .6cqw; flex-wrap: wrap; }
  .sw span { position: relative; width: 3.4cqw; height: 3.4cqw; border-radius: .5cqw; border: .1cqw solid #333; }
  .tok p { position: relative; font: 1.25cqw/1.45 var(--text); color: #ddd; }
</style>
</head>
<body>
<header>
  <h1>Agent Notch, launch promo <small>v1</small></h1>
  <p>Fun, loud chaos from too many coding agents, until a glossy black notch drops in and brings order.</p>
  <span class="tag">1920×1080 · ~46s · 10 beats · music + SFX, no voice</span>
</header>
