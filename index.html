  return sw
}

const LAUNCHABLE = ['claude', 'agy', 'opencode', 'kilo'] // terminal agents; Copilot lives in VS Code
const MAX_AGENTS = 8 // windows are heavy; main.js enforces the same cap

async function openLauncher(dir) {
  const recent = await notch.invoke('recent')
  let last = {}
  try { last = JSON.parse(localStorage.getItem('launch')) || {} } catch {}
  const saved = Array.isArray(last.agents) ? Object.fromEntries(last.agents.map(a => [a, 1])) : last.agents || {} // older versions saved a list: one of each
  const agents = new Map(Object.entries(saved).filter(([a, n]) => LAUNCHABLE.includes(a) && n > 0))
  if (!agents.size) agents.set('claude', 1)
  launcher = { agents, dir: dir || recent[0] || '', recent, auto: !!last.auto, worktree: false, split: false, folders: false } // agents: provider -> how many
  view = 'launch'
  if (!keyboard) notch.send('grab-focus')
  buildLauncher()
  if (open) { anim(panel, [{ opacity: 0, filter: 'blur(5px)' }, { opacity: 1, filter: 'blur(0px)' }], { duration: 320 }); layout() } else setOpen(true)
  setTimeout(() => panel.querySelector('textarea')?.focus(), 60)
}

function closeLauncher(collapse) {
  if (view !== 'launch') return
  view = 'list'; launcher = null
  if (!keyboard) notch.send('keyboard-closed')
  if (collapse) setOpen(false)
  render()
  if (!collapse) anim(panel, [{ opacity: 0, filter: 'blur(5px)' }, { opacity: 1, filter: 'blur(0px)' }], { duration: 320 })
}

function buildLauncher() {
  const L = launcher
  const head = el('div', 'head'), back = el('button', 'round')
  back.innerHTML = BACK_ICON; back.title = 'Back (Esc)'; back.onclick = () => closeLauncher(false)
  head.append(back, el('h1', '', 'New agent'), el('span', 'summary', 'opens in a new terminal'))

  const total = () => [...L.agents.values()].reduce((a, b) => a + b, 0)
  const chips = el('div', 'chips'), paintChips = []
  for (const a of LAUNCHABLE) { // a chip toggles a provider on or off; the stepper under it sets how many
    const col = el('div', 'chipcol'), c = el('button', 'chip'); c.append(icon(a), NAMES[a])
    const step = el('div', 'step'), minus = el('button', '', '−'), count = el('span'), plus = el('button', '', '+')
    minus.title = 'One fewer ' + NAMES[a]; plus.title = 'Another ' + NAMES[a]
    step.append(minus, count, plus)
    const paint = () => { const n = L.agents.get(a) || 0; c.classList.toggle('on', n > 0); step.classList.toggle('on', n > 0); count.textContent = n; plus.disabled = total() >= MAX_AGENTS }
    const set = n => { if (n > 0) L.agents.set(a, n); else L.agents.delete(a); tick(n > 0); paintChips.forEach(p => p()); refresh() }
    c.onclick = () => set(L.agents.has(a) ? 0 : 1)
    minus.onclick = () => set((L.agents.get(a) || 0) - 1)
    plus.onclick = () => total() < MAX_AGENTS && set((L.agents.get(a) || 0) + 1)
    paintChips.push(paint); paint()
    col.append(c, step); chips.append(col)
  }

  const field = el('button', 'field'), fname = el('b'), fpath = el('span', 'fpath'), folders = el('div', 'folders'), chev = el('span')
  const folderIcon = el('span'); folderIcon.innerHTML = FOLDER_ICON; chev.innerHTML = CHEV_ICON
  field.append(folderIcon, fname, fpath, chev)
  field.onclick = () => { L.folders = !L.folders; refresh(); if (L.folders) anim(folders, [{ opacity: 0, translate: '0 -6px' }, { opacity: 1, translate: '0 0' }], { duration: 300 }) }
  const pick = d => { L.dir = d; L.folders = false; refresh(); ta.focus() }
  const fillFolders = () => {
    const rows = L.recent.map(d => { const b = el('button'); b.append(el('b', '', baseName(d)), el('span', '', d)); b.onclick = () => pick(d); return b })
    const browse = el('button', 'browse'); browse.append(el('b', '', 'Browse…'))
    browse.onclick = async () => {
      browsing = true
      const d = await notch.invoke('browse')
      setTimeout(() => (browsing = false), 500) // focus bounces around as the dialog closes; don't read that as "clicked away"
      if (d) { if (!L.recent.includes(d)) L.recent.unshift(d); pick(d) }
    }
    folders.replaceChildren(...rows, browse)
  }

  const ta = el('textarea'); ta.placeholder = 'What should it do? (optional)'; ta.spellcheck = false
  ta.onkeydown = e => { if (e.key === 'Enter' && e.ctrlKey) { e.preventDefault(); go() } }
  const auto = switchEl('AUTO', () => L.auto, v => (L.auto = v), 'Approve every permission for these agents')
  const split = switchEl('SPLIT', () => L.split, v => { L.split = v; ta.placeholder = v ? 'One task per line: each line starts its own agent' : 'What should it do? (optional)'; refresh() }, 'One task per line: each line becomes its own agent, shared out across the providers you picked')
  const worktree = switchEl('WORKTREE', () => L.worktree, v => (L.worktree = v), "Give each agent its own git worktree and branch, so parallel agents can't overwrite each other")
  const btn = el('button', 'go'), err = el('div', 'err'), opts = el('div', 'opts')
  btn.onclick = go
  opts.append(auto, worktree, split, btn)

  // What to start: every provider as many times as asked, or in SPLIT mode one agent per line of the box (providers taking turns)
  function plan() {
    const slots = [...L.agents].flatMap(([a, n]) => Array(n).fill(a))
    if (!L.split) return { agents: slots, prompts: null }
    const tasks = ta.value.split(/\r?\n/).map(s => s.trim()).filter(Boolean).slice(0, MAX_AGENTS)
    return { agents: slots.length ? tasks.map((_, i) => slots[i % slots.length]) : [], prompts: tasks }
  }

  async function go() {
    if (btn.disabled) return
    btn.disabled = true; btn.classList.add('busy'); err.textContent = ''
    const { agents, prompts } = plan(), res = await notch.invoke('launch', { agents, prompts, dir: L.dir, prompt: ta.value, auto: L.auto, worktree: L.worktree })
    btn.classList.remove('busy'); refresh()
    if (res.error) { // shake it off
      err.textContent = res.error; layout()
      anim(err, [0, -7, 6, -4, 2, 0].map(x => ({ translate: x + 'px 0' })), { duration: 420, easing: 'ease-out' })
      return
    }
    try { localStorage.setItem('launch', JSON.stringify({ agents: Object.fromEntries(L.agents), auto: L.auto })) } catch {}
    chime()
    showToast({
      lead: () => stack(agents), right: baseName(L.dir), line: ta.value.trim() || (L.worktree ? 'each in its own worktree' : 'in a new terminal'),
      title: () => el('b', 'ok', 'Launching ' + [...new Set(agents)].map(a => NAMES[a] + (agents.filter(x => x === a).length > 1 ? ' ×' + agents.filter(x => x === a).length : '')).join(' + ')),
    }, 2800)
    closeLauncher(true)
  }

  function refresh() {
    fname.textContent = L.dir ? baseName(L.dir) : 'Choose a folder'
    fpath.textContent = L.dir
    field.classList.toggle('open', L.folders)
    folders.hidden = !L.folders
    if (L.folders) fillFolders()
    const n = plan().agents.length
    btn.replaceChildren(n > 1 ? `Launch ${n}` : 'Launch', el('kbd', '', 'Ctrl ↵'))
    btn.disabled = !n || !L.dir
    layout()
  }

  const wrap = el('div', 'launch')
  wrap.append(head, chips, field, folders, ta, opts, err)
  panel.replaceChildren(wrap)
  refresh()
}

function layout() {
  island.classList.toggle('open', open)
  const dot = welcome === 'drop' || farewell === 'dot'
  island.style.width = (open ? 460 : dot ? 36 : pill.offsetWidth) + 'px'
  island.style.height = (open ? Math.min(panel.scrollHeight, 690) : dot ? 36 : pill.offsetHeight) + 'px'
}

function render() { renderPill(); renderPanel(); layout(); changed = new Set() }

function setOpen(v) {
  clearTimeout(hoverTimer)
  if (v === open) return
  open = v
  if (!v) { menuOpen = false; panel.style.minHeight = ''; panel.querySelector('.menu')?.remove() } // collapsing mid-menu must not leave it behind for the next open
  clearTimeout(setOpen.shrink)
  if (v) notch.send('size', true) // grow the window before the panel animates out
  else setOpen.shrink = setTimeout(() => open || notch.send('size', false), 750) // shrink once the collapse has finished
  if (v) {
    peek = null; welcome = null; renderPill()
    // Stagger the panel's contents in, top to bottom
    panel.querySelectorAll('.head, .group > .title, .row, .foot, .keys, .chips, .field, textarea, .opts').forEach((e, i) =>
      anim(e, [{ opacity: 0, translate: '0 10px', filter: 'blur(3px)' }, { opacity: 1, translate: '0 0', filter: 'blur(0px)' }], { duration: 480, delay: 70 + Math.min(i, 12) * 28, fill: 'backwards' }))
  }
  if (!v && view === 'help') { view = 'list'; setTimeout(render, 450) } // after the collapse animation
  renderPill(); layout()
  v ? stopVenom() : armVenom()
}

island.addEventListener('mouseenter', () => {
  notch.send('mouse', true)
  if (farewell || keyboard || view === 'launch' || view === 'setup' || editing || pill.classList.contains('request')) return // requests expand on click, so Allow/Deny don't move under the cursor
  clearTimeout(hoverTimer); hoverTimer = setTimeout(() => setOpen(true), 90)
})
island.addEventListener('mouseleave', () => {
  if (drag) return // the window is moving under the cursor
  notch.send('mouse', false)
  if (keyboard || view === 'launch' || view === 'setup' || editing) return
  clearTimeout(hoverTimer); hoverTimer = setTimeout(() => setOpen(false), 280)
})
// Drag the pill or the panel header to move the notch along the top of the screen (main.js follows the cursor).
let drag = null, dragEnded = 0, dragRaf = 0
island.addEventListener('pointerdown', e => {
  if (e.button !== 0 || farewell || welcome || !(e.target.closest('#pill, .head') || (e.target === panel && e.offsetY < 56)) || e.target.closest('button, input, textarea')) return // the pill, the header, or the strip of panel above it
  drag = { x: e.clientX, sx: e.screenX, moved: false }
  island.setPointerCapture(e.pointerId)
})
let tiltTimer = 0
island.addEventListener('pointermove', e => {
  if (!drag) return
  if (!drag.moved) {
    if (Math.abs(e.clientX - drag.x) < 5) return // a click, not a drag
    drag.moved = true; island.classList.add('dragging'); clearTimeout(hoverTimer); notch.send('drag-start')
  }
  // It hangs from the top edge: moving sideways swings it the way a pendulum lags, and it settles when you stop
  const swing = open ? 2 : 7 // the open panel is tall and the window only a little wider, so it swings less
  island.style.rotate = Math.max(-swing, Math.min(swing, (e.screenX - drag.sx) * .6)) + 'deg'
  drag.sx = e.screenX
  clearTimeout(tiltTimer); tiltTimer = setTimeout(() => { island.style.rotate = '' }, 70)
  dragRaf ||= requestAnimationFrame(() => { dragRaf = 0; notch.send('drag-move') })
})
const endDrag = e => {
  if (!drag) return
  const moved = drag.moved
  drag = null; island.classList.remove('dragging'); clearTimeout(tiltTimer); island.style.rotate = ''
  try { island.releasePointerCapture(e.pointerId) } catch {}
  if (!moved) return
  dragEnded = performance.now(); notch.send('drag-end'); notch.send('mouse', island.matches(':hover'))
}
island.addEventListener('pointerup', endDrag); island.addEventListener('pointercancel', endDrag)
pill.addEventListener('click', () => performance.now() - dragEnded > 300 && pill.classList.contains('request') && setOpen(true))

function closeKeyboard() {
  if (!keyboard) return
  keyboard = false; setOpen(false); render()
  notch.send('keyboard-closed')
}
notch.onKeyboard(on => {
  if (!on) return closeKeyboard()
  keyboard = true
  const r = ordered.findIndex(s => s.request)
  sel = Math.max(0, r >= 0 ? r : ordered.findIndex(s => s.state === 'waiting'))
  render(); setOpen(true)
})
window.addEventListener('blur', () => {
  if (browsing || editing) return // the folder picker has focus / the rename input commits on its own blur
  if (view === 'launch' && !keyboard) return closeLauncher(true)
  view = 'list'; launcher = null
  closeKeyboard()
})
document.addEventListener('keydown', e => {
  if (view === 'launch') { if (e.key === 'Escape') { e.preventDefault(); closeLauncher(false) } return }
  if (view === 'setup') { if (e.key === 'Escape') { e.preventDefault(); closeSetup(false) } return }
  if (view === 'help') { if (['Escape', 'Backspace', 'i', 'I', '?'].includes(e.key)) { e.preventDefault(); closeHelp() } return }
  if (menuOpen && e.key === 'Escape') { e.preventDefault(); return setMenu(false) }
  if (!keyboard || editing) return
  const s = ordered[sel]
  switch (e.key.toLowerCase()) {
    case 'arrowdown': sel = Math.min(sel + 1, ordered.length - 1); break
    case 'arrowup': sel = Math.max(sel - 1, 0); break
    case 'enter': if (s) notch.send('focus', s.key); return closeKeyboard()
    case 'y': if (s?.request) decideUI(s, 'allow'); break
    case 'n': if (s?.request) decideUI(s, 'deny'); break
    case 'a': if (s) { tick(!s.auto); notch.send('auto', s.key, !s.auto) } break
    case 'g': notch.send('grid'); return closeKeyboard()
    case 'r': if (s) { e.preventDefault(); startRename(s, panel.querySelectorAll('.row')[sel].querySelector('.name')) } return
    case '+': case '=': case 'l': e.preventDefault(); return openLauncher()
    case 'escape': return closeKeyboard()
    case 'd': case 'delete': { const r = panel.querySelectorAll('.row')[sel]; if (s && r) leave(r, s.key); sel = Math.max(0, sel - (sel === ordered.length - 1 ? 1 : 0)); return }
    case 'c': panel.querySelectorAll('.row.done').forEach((r, i) => setTimeout(() => leave(r, r.dataset.key), i * 45)); return
    case 's': sound = !sound; try { localStorage.setItem('sound', sound ? 'on' : 'off') } catch {}; tick(); break
    case 'q': return notch.send('quit')
    case 'z': { const next = !asleep; closeKeyboard(); return setAsleep(next) }
    case 'arrowleft': e.preventDefault(); return notch.send('nudge', -1)
    case 'arrowright': e.preventDefault(); return notch.send('nudge', 1)
    case 'home': e.preventDefault(); return notch.send('recenter')
    case 'i': case '?': e.preventDefault(); return openHelp()
    case ',': e.preventDefault(); return openSetup(false)
    default: return
  }
  e.preventDefault(); render()
})

notch.onSessions((list, lim) => {
  limits = lim || {}
  for (const s of list) {
    const was = prevState[s.key]
    if (was && was !== s.state) {
      changed.add(s.key)
      if (s.state === 'error') setTimeout(() => react('grumpy'), 650) // a stopped agent: grumpy shake, after its peek
      if ((s.state === 'done' || s.state === 'waiting' || s.state === 'error') && !open) { // Live-Activity-style peek
        peek = s
        clearTimeout(peekTimer); peekTimer = setTimeout(() => { peek = null; render() }, PEEK_MS)
      }
    }
  }
  if (peek) peek = list.find(s => s.key === peek.key) || null
  prevState = Object.fromEntries(list.map(s => [s.key, s.state]))
  sessions = list
  render()
  known = new Set(list.map(s => s.key)) // rows seen from here on animate in when new
  warnLimits()
  moods(list)
  quiet() ? armVenom() : stopVenom()
})

// Idle animations. After a long quiet spell the notch gets up to mischief (escaping agents grabbed back by tendrils, a
// Pac-Man snack, a juggling act). A closed, quiet notch also grows eyes that follow a cursor lingering near it, and it
// reacts to what happens (a happy squish, a grumpy shake, an impatient nudge). None of it runs while anything is working
// or the panel is open, each scene plays at most once per REPEAT_MS, any touch stops it, and between plays it costs
// nothing: a scene runs one frame loop for a few seconds, everything else is single timeouts.
const IDLE_MS = 4 * 60e3, REPEAT_MS = 12 * 60e3
let idleAnim = true, venomTimer = 0, venomRun = null, idleLast = '', idleCycle = 0
try { idleAnim = localStorage.getItem('idleAnim') !== 'off' } catch {}
const venomLayer = document.getElementById('venom'), venomSvg = venomLayer.querySelector('svg'), venomGoo = venomSvg.querySelector('g')
const quiet = () => !sessions.some(s => s.state === 'working' || s.state === 'waiting')
const clamp01 = x => Math.min(1, Math.max(0, x))
const ease = x => x * x * (3 - 2 * x), easeOut = x => 1 - (1 - x) ** 3
const mix = (a, b, t) => ({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t })
const DOT_COLOR = { claude: '#D97757', agy: '#3DBE6A', opencode: '#EDE8E6', kilo: '#F8F675', copilot: '#8B5CF6' }
const svgEl = (tag, fill) => { const e = document.createElementNS('http://www.w3.org/2000/svg', tag); if (fill) e.style.fill = fill; venomGoo.append(e); return e }

function armVenom() {
  if (venomTimer || venomRun || calm || asleep || !idleAnim || !quiet() || open || welcome || farewell) return
  venomTimer = setTimeout(() => playIdle(), IDLE_MS)
}
function stopVenom() { clearTimeout(venomTimer); venomTimer = 0; eyesOff(); if (venomRun) venomRun.stop = true }

// One smooth curve through the points (Catmull-Rom); u runs 0..1 across all of them.
function spline(P, u) {
  const n = P.length - 1, f = clamp01(u) * n, i = Math.min(n - 1, Math.floor(f)), t = f - i
  const [p0, p1, p2, p3] = [P[Math.max(0, i - 1)], P[i], P[i + 1], P[Math.min(n, i + 2)]]
  const c = (a, b, c2, d) => 0.5 * (2 * b + (-a + c2) * t + (2 * a - 5 * b + 4 * c2 - d) * t * t + (-a + 3 * b - 3 * c2 + d) * t ** 3)
  return { x: c(p0.x, p1.x, p2.x, p3.x), y: c(p0.y, p1.y, p2.y, p3.y) }
}

// A tapered strip along `pts`, as a closed path (width w0 at the start, w1 at the end).
function ribbon(pts, w0, w1) {
  const L = [], R = []
  pts.forEach((p, i) => {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)]
    const d = Math.hypot(b.x - a.x, b.y - a.y) || 1, w = (w0 + (w1 - w0) * i / (pts.length - 1)) / 2
    L.push(`${(p.x - (b.y - a.y) / d * w).toFixed(1)} ${(p.y + (b.x - a.x) / d * w).toFixed(1)}`)
    R.push(`${(p.x + (b.y - a.y) / d * w).toFixed(1)} ${(p.y - (b.x - a.x) / d * w).toFixed(1)}`)
  })
  return `M${L.join('L')}L${R.reverse().join('L')}Z`
}

// Each scene gets the stage (pill rect r, its centre cx, window size) and returns { END, frame(t), nodes }: the
// seconds it lasts, a function that draws time t, and everything it added so it can be cleaned up.
const SCENES = {
  // The agents try to escape; black tendrils with clawed hands grab each one and drag it back into the notch.
  venom({ W, H, r, cx, rnd }) {
    const agents = Object.keys(GLYPH), N = agents.length, nodes = []
    const keep = x => Math.min(W - 24, Math.max(24, x))
    const crew = agents.map((a, i) => {
      const sprite = icon(a); sprite.classList.add('vlogo'); venomLayer.insertBefore(sprite, venomSvg)
      const arm = svgEl('path'); nodes.push(sprite, arm)
      const side = i % 2 ? 1 : -1, A = { x: r.left + r.width * (0.2 + 0.15 * i), y: r.bottom - 10 }   // slips out of the pill here
      const G = { x: keep(cx + (i - (N - 1) / 2) * 64 + rnd(-10, 10)), y: r.bottom + rnd(36, 84) }    // and is caught here
      // out of the pill, a wide sweep to one side, then in to where it's caught: one flowing path that never doubles back
      const way = [A, { x: A.x + side * 24, y: r.bottom + 14 }, { x: keep((G.x + cx + side * 150) / 2), y: r.bottom + rnd(44, 74) }, G]
      return { sprite, arm, A, G, way, t0: 0.1 + 0.16 * i, tg: 1.9 + 0.2 * i, done: false, ph: rnd(0, 6) }
    })
    const TRAVEL = 1.5, END = 1.9 + 0.2 * (N - 1) + 0.25 + 0.4 + 0.3
    const where = (c, t) => { // the escapee's position, tilt, scale and opacity at time t
      const run = t - c.t0
      if (run < 0) return { p: c.A, rot: 0, sc: 0, op: 0 }
      const u = 1 - (1 - clamp01(run / TRAVEL)) ** 1.5, loose = t < c.tg ? 1 : 0
      let p = spline(c.way, u)
      p = { x: p.x, y: p.y + Math.sin(u * 9 + c.ph) * 5 * (1 - u) * loose } // a scurrying weave
      const pull = clamp01((t - c.tg - 0.25) / 0.4)
      if (pull > 0) p = mix(c.G, c.A, ease(pull) ** 1.5)
      return { p, rot: Math.sin(t * 8 + c.ph) * 7 * loose * (1 - u * 0.6), sc: ease(clamp01(run / 0.25)) * (1 - 0.1 * ease(clamp01((t - c.tg) / 0.25))) * (1 - 0.75 * pull), op: pull > 0.8 ? 1 - (pull - 0.8) / 0.2 : 1 }
    }
    const frame = t => {
      for (const c of crew) {
        const s = where(c, t)
        c.sprite.style.transform = `translate3d(${s.p.x - 11}px, ${s.p.y - 11}px, 0) rotate(${s.rot}deg) scale(${s.sc})`
        c.sprite.style.opacity = s.op
        // the tendril: reaches out to its escapee, closes its fingers round it, and drags it home
        const reach = clamp01((t - (c.tg - 0.5)) / 0.5), pull = clamp01((t - c.tg - 0.25) / 0.4)
        if (reach <= 0 || pull >= 1) {
          c.arm.setAttribute('d', '')
          if (pull >= 1 && !c.done) { c.done = true; anim(island, [{ scale: 1 }, { scale: 1.04 }, { scale: 0.99 }, { scale: 1 }], { duration: 380 }) }
          continue
        }
        const root = c.A, tip = reach < 1 ? mix(root, s.p, easeOut(reach)) : s.p
        const dx = tip.x - root.x, dy = tip.y - root.y, len = Math.hypot(dx, dy) || 1, nx = -dy / len, ny = dx / len
        const amp = Math.min(20, len * 0.22) * (reach < 1 ? 1 : 0.5), ph = t * 6 + c.ph
        const c1 = { x: root.x + dx * 0.33 + nx * amp * Math.sin(ph), y: root.y + dy * 0.33 + ny * amp * Math.sin(ph) }
        const c2 = { x: root.x + dx * 0.66 - nx * amp * Math.sin(ph + 1.9), y: root.y + dy * 0.66 - ny * amp * Math.sin(ph + 1.9) }
        const bez = u => { const v = 1 - u; return { x: v ** 3 * root.x + 3 * v * v * u * c1.x + 3 * v * u * u * c2.x + u ** 3 * tip.x, y: v ** 3 * root.y + 3 * v * v * u * c1.y + 3 * v * u * u * c2.y + u ** 3 * tip.y } }
        const pts = Array.from({ length: 13 }, (_, i) => bez(i / 12))
        const a = pts[11], th = Math.atan2(tip.y - a.y, tip.x - a.x)
        const open = 1 - easeOut(clamp01((t - c.tg) / 0.25)), curl = 0.25 + 0.9 * (1 - open)
        let d = ribbon(pts, 8, 4) + `M${tip.x - 4.8} ${tip.y}a4.8 4.8 0 1 0 9.6 0a4.8 4.8 0 1 0 -9.6 0Z` // the arm, and a palm for the fingers
        for (const k of [-1.5, -0.5, 0.5, 1.5]) { // four fingers: fanned open while reaching, closed round the logo on the grab
          const ang0 = th + k * (0.8 * open + 0.15), fin = [{ x: tip.x - Math.cos(th) * 2, y: tip.y - Math.sin(th) * 2 }]
          for (let j = 1; j <= 5; j++) { const ang = ang0 - Math.sign(k) * curl * (j / 5) * 1.4; fin.push({ x: fin[j - 1].x + Math.cos(ang) * 3.8, y: fin[j - 1].y + Math.sin(ang) * 3.8 }) }
          d += ribbon(fin, 4.6, 1.8)
        }
        c.arm.setAttribute('d', d)
      }
    }
    return { END, frame, nodes, finish: () => anim(island, [{ scale: 1 }, { scale: 1.06 }, { scale: 0.985 }, { scale: 1 }], { duration: 480 }) }
  },

  // Pac-Man runs along under the notch and eats the agents' dots; they pop back and hurry home.
  pacman({ r, cx }) {
    const agents = Object.keys(GLYPH), y = r.bottom + 20, xL = cx - 150, xR = cx + 174, R = 9
    const RUN0 = 0.45, RUN1 = 2.0, END = 3.55
    const pac = svgEl('path', '#FFD60A'), nodes = [pac]
    const pel = agents.map((a, i) => {
      const dot = svgEl('circle', DOT_COLOR[a]); dot.setAttribute('r', 4.6); nodes.push(dot)
      const x = cx + (i - (agents.length - 1) / 2) * 52, A = { x: r.left + r.width * (0.2 + 0.15 * i), y: r.bottom - 10 }
      return { dot, x, A, i, eatenAt: RUN0 + (x - 3 - xL) / (xR - xL) * (RUN1 - RUN0), back: 2.15 + 0.12 * i, home: 2.85 + 0.1 * i }
    })
    let gulped = false
    const frame = t => {
      const px = xL + (xR - xL) * clamp01((t - RUN0) / (RUN1 - RUN0)), grow = ease(clamp01(t / 0.3)) * (1 - ease(clamp01((t - RUN1 - 0.05) / 0.2)))
      const m = 0.12 + 0.5 * Math.abs(Math.sin(t * 16)) * (t > RUN0 && t < RUN1 ? 1 : 0.2), k = R * grow
      pac.setAttribute('d', k < 0.5 ? '' : `M${px} ${y}L${px + k * Math.cos(m)} ${y - k * Math.sin(m)}A${k} ${k} 0 1 0 ${px + k * Math.cos(m)} ${y + k * Math.sin(m)}Z`)
      for (const p of pel) {
        let pos = { x: p.x, y }, sc = easeOut(clamp01((t - 0.05 * p.i) / 0.25))
        if (t >= p.eatenAt && t < p.back) sc = 0                                   // eaten
        else if (t >= p.back) { sc = 1 + 0.25 * Math.sin(clamp01((t - p.back) / 0.25) * Math.PI) * ease(clamp01((t - p.back) / 0.25)); if (t >= p.home) { const h = clamp01((t - p.home) / 0.45); pos = mix(pos, p.A, ease(h)); sc *= 1 - ease(h) } }
        p.dot.setAttribute('cx', pos.x); p.dot.setAttribute('cy', pos.y); p.dot.setAttribute('r', 4.6 * sc)
      }
      if (!gulped && t >= pel.at(-1).eatenAt) { gulped = true; anim(island, [{ scale: 1 }, { scale: 1.05 }, { scale: 0.99 }, { scale: 1 }], { duration: 380 }) } // the last gulp
    }
    return { END, frame, nodes }
  },

  // The agents' dots hop out of the notch and juggle (a five-ball cascade), then drop back in.
  juggle({ r, cx }) {
    const agents = Object.keys(GLYPH), N = agents.length, nodes = []
    const hand = [{ x: cx - 38, y: r.bottom + 26 }, { x: cx + 38, y: r.bottom + 26 }], APEX = 42, B = 0.15, T = N * B, TSTOP = 2.3
    const balls = agents.map((a, i) => {
      const c = svgEl('circle', DOT_COLOR[a]); c.setAttribute("r", 5.5); nodes.push(c)
      const t0 = 0.3 + i * B, kmax = Math.max(0, Math.ceil((TSTOP - t0) / T) - 1)
      return { c, i, t0, kmax, A: { x: r.left + r.width * (0.2 + 0.15 * i), y: r.bottom - 10 }, landing: t0 + (kmax + 1) * T }
    })
    const END = Math.max(...balls.map(b => b.landing)) + 0.5
    const frame = t => {
      for (const b of balls) {
        let p, sc = 1
        if (t < b.t0) { const u = ease(clamp01((t - 0.04 * b.i) / (b.t0 - 0.04 * b.i))); p = mix(b.A, hand[b.i % 2], u); sc = ease(clamp01((t - 0.04 * b.i) / 0.2)) } // hops out into its hand
        else {
          const k = Math.min(Math.floor((t - b.t0) / T), b.kmax), n = b.i + k * N, u = clamp01((t - b.t0 - k * T) / T), from = hand[n % 2], to = hand[(n + 1) % 2]
          p = { x: from.x + (to.x - from.x) * u, y: from.y - 4 * APEX * u * (1 - u) } // a throw: thrown from one hand, caught by the other
          if (t > b.landing) { const h = clamp01((t - b.landing) / 0.4); p = mix(to, b.A, ease(h)); sc = 1 - 0.8 * ease(h) } // and home
        }
        b.c.setAttribute('cx', p.x); b.c.setAttribute('cy', p.y); b.c.setAttribute("r", 5.5 * sc)
      }
    }
    return { END, frame, nodes }
  },
}

function playIdle(now = false, kind) { // now: you asked for it (Ctrl+Alt+V), so skip the idle and quiet checks
  venomTimer = 0
  if (venomRun || calm || asleep || open || welcome || farewell || view !== 'list' || !now && (!idleAnim || !quiet())) return
  eyesOff()
  const names = Object.keys(SCENES)
  kind ||= (idleLast = names.filter(n => n !== idleLast)[Math.floor(Math.random() * (names.length - 1))])
  const W = innerWidth, H = innerHeight, r = island.getBoundingClientRect()
  venomSvg.setAttribute('viewBox', `0 0 ${W} ${H}`)
  const scene = SCENES[kind]({ W, H, r, cx: r.left + r.width / 2, rnd: (a, b) => a + Math.random() * (b - a) })
  const t0 = performance.now(), job = venomRun = { stop: false, raf: 0 }
  venomLayer.style.display = 'block'
  const end = () => {
    cancelAnimationFrame(job.raf)
    scene.nodes.forEach(n => n.remove())
    venomLayer.style.display = 'none'; venomLayer.style.opacity = ''
    venomRun = null
    clearTimeout(venomTimer); venomTimer = 0
    if (!job.stop) venomTimer = setTimeout(() => playIdle(), REPEAT_MS)
  }
  const frame = now => {
    const t = (now - t0) / 1000
    if (job.stop) { anim(venomLayer, [{ opacity: 1 }, { opacity: 0 }], { duration: 160, fill: 'forwards' }); return void setTimeout(end, 170) }
    scene.frame(t)
    if (t >= scene.END) { scene.finish?.(); return end() }
    job.raf = requestAnimationFrame(frame)
  }
  job.raf = requestAnimationFrame(frame)
}
function setAsleep(v) {
  if (v === asleep) return
  asleep = v
  try { localStorage.setItem('asleep', v ? 'on' : 'off') } catch {}
  stopVenom()
  if (v) { peek = null; toast = null }
  render()
  anim(island, v ? [{ scale: 1 }, { scale: 1.08 }, { scale: 0.9 }, { scale: 1 }] : [{ scale: 1 }, { scale: 1.12 }, { scale: 0.97 }, { scale: 1 }], { duration: 520 }) // a yawn, or a stretch
  if (!v) armVenom()
}
notch.onSleep(() => { if (keyboard) closeKeyboard(); setAsleep(!asleep) })
notch.onVenom(() => { // Ctrl+Alt+V: play the next scene; press again for the one after
  clearTimeout(venomTimer); venomTimer = 0
  playIdle(true, Object.keys(SCENES)[idleCycle++ % Object.keys(SCENES).length])
})

// Eyes: while the notch is closed and quiet, two eyes open in the pill when your cursor lingers close to it, follow it,
// blink now and then, and close when you move on. Hovering the notch itself still opens it as usual.
const eyes = document.getElementById('eyes'), pupils = eyes.querySelectorAll('b')
let eyesTimer = 0, eyesWait = 0, blinkTimer = 0, eyesOn = false, cursor = { x: 0, y: 0 }
function eyesOff() {
  clearTimeout(eyesTimer); clearTimeout(eyesWait); clearTimeout(blinkTimer); eyesWait = 0
  if (eyesOn) { eyesOn = false; island.classList.remove('eyed') }
}
function blink() {
  blinkTimer = setTimeout(() => { anim(eyes, [{ scale: '1 1' }, { scale: '1 0.1' }, { scale: '1 1' }], { duration: 170 }); blink() }, 2200 + Math.random() * 2800)
}
document.addEventListener('mousemove', e => {
  cursor = { x: e.clientX, y: e.clientY }
  if (calm || asleep || !idleAnim || !quiet() || open || venomRun || welcome || farewell || view !== 'list' || island.matches(':hover')) return eyesOff()
  const r = island.getBoundingClientRect(), dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2), dist = Math.hypot(dx, dy)
  if (dist > 150) { if (eyesOn || eyesWait) { clearTimeout(eyesTimer); eyesTimer = setTimeout(eyesOff, 400) } return }
  clearTimeout(eyesTimer); eyesTimer = setTimeout(eyesOff, 1500) // closes when the cursor stops or leaves
  if (!eyesOn && !eyesWait) eyesWait = setTimeout(() => { // only once it has lingered
    eyesWait = 0
    const rr = island.getBoundingClientRect()
    if (!quiet() || open || venomRun || Math.hypot(cursor.x - (rr.left + rr.width / 2), cursor.y - (rr.top + rr.height / 2)) > 150) return
    eyesOn = true; island.classList.add('eyed'); clearTimeout(blinkTimer); blink()
  }, 700)
  if (eyesOn) pupils.forEach(p => {
    const k = Math.min(1, dist / 60)
    p.style.setProperty('--px', (dx / (dist || 1)) * 3 * k + 'px'); p.style.setProperty('--py', (dy / (dist || 1)) * 4.5 * k + 'px')
  })
})

// Moods: the notch reacts to what happens. Quick one-shots, and one slow timer only while a request is waiting.
function react(kind) {
  if (calm || asleep || !idleAnim || open || venomRun) return
  if (kind === 'happy') anim(island, [{ scale: '1 1' }, { scale: '1.08 0.88' }, { scale: '0.95 1.14' }, { scale: '1.02 0.98' }, { scale: '1 1' }], { duration: 640 }) // everything's done: a happy squish
  if (kind === 'grumpy') anim(island, [-4, 4, -3, 3, -1, 0].map(x => ({ translate: `calc(-50% + ${x}px) 0` })), { duration: 440, easing: 'ease-in-out' }) // something stopped: a shake
  if (kind === 'nudge') anim(island, [0, -4, 4, -3, 0].map(d => ({ rotate: d + 'deg' })), { duration: 700 }) // you've kept it waiting: ahem
}
let workingBefore = 0, nudgeTimer = 0
function moods(list) {
  const working = list.filter(s => s.state === 'working').length, waiting = list.some(s => s.state === 'waiting')
  if (workingBefore > 0 && !working && !waiting && list.some(s => s.state === 'done')) setTimeout(() => react('happy'), PEEK_MS + 250) // after the "finished" peek
  workingBefore = working
  if (waiting && !nudgeTimer) nudgeTimer = setInterval(() => react('nudge'), 60e3)
  else if (!waiting && nudgeTimer) { clearInterval(nudgeTimer); nudgeTimer = 0 }
}

// Updates: the notch downloads a new version quietly and installs it when you quit. Tell the user once it's ready.
let upd = { status: 'idle', version: '', next: '', error: '', auto: true }
let paintUpdate = null // set while Setup is open, so its Updates row follows along
function updateCard() {
  const c = el('div', 'update'), body = el('div', 'sbody'), go = el('button', 'mini', 'Restart now')
  body.append(el('b', '', 'Update ready: ' + upd.next), el('span', 'sub', 'Installs when you quit'))
  go.onclick = () => { notch.send('update-restart'); go.disabled = true; go.textContent = 'Restarting…' }
  c.append(body, go)
  return c
}
notch.onUpdate(s => {
  const was = upd.status
  upd = s
  if (s.status === 'ready' && was !== 'ready') { chime(); showToast({ lead: () => badge(true), title: () => el('b', 'ok', 'Update ready'), right: 'v' + s.next, line: 'Installs when you quit, or restart now' }, 6000) }
  paintUpdate?.()
  if (view === 'list') render()
})
notch.invoke('update-state').then(s => { upd = s; paintUpdate?.() })

// Welcome: a dot drops in, stretches into a pill, agents pop in one by one, then it settles.
if (welcome) {
  setTimeout(() => island.classList.remove('intro'), 40) // a timer, not rAF: rAF can stall while hidden and the notch would stay invisible
  setTimeout(() => { if (welcome) { welcome = 'hello'; render() } }, 380)
  setTimeout(() => { if (welcome) { welcome = null; render() } firstRun(); armVenom() }, 2700)
} else { island.classList.remove('intro'); setTimeout(firstRun, 300) }
async function firstRun() { if (!(await notch.invoke('setup-status')).done) openSetup(true) }

setInterval(() => { if (open) for (const t of document.querySelectorAll('.timer')) t.textContent = duration(+t.dataset.since) }, 1000) // only visible timers
render()
armVenom()
notch.send('ready')
</script>
</body>
</html>
