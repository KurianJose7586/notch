<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Notch</title>
<style>
  :root {
    --spring: linear(0, .012, .05 2.6%, .2 6%, .45 11%, .72 17%, .9 23%, 1.01 30%, 1.04 36%, 1.035 42%, 1.012 52%, .998 65%, 1);
    --ease: cubic-bezier(.32, .72, 0, 1);
    --label: #fff;
    --secondary: rgba(235, 235, 245, .6);
    --tertiary: rgba(235, 235, 245, .3);
    --fill: rgba(118, 118, 128, .18);
    --sep: rgba(84, 84, 88, .45);
    --blue: #0A84FF; --green: #30D158; --orange: #FF9F0A; --red: #FF453A; --gray: #8E8E93; --purple: #BF5AF2;
    --mono: "Cascadia Mono", "SF Mono", Consolas, monospace;
  }
  @property --spin { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: transparent; overflow: hidden; height: 100%; }
  body {
    font: 13px/1.35 "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    color: var(--label); -webkit-font-smoothing: antialiased; user-select: none; cursor: default;
  }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }

  #island {
    position: absolute; top: 8px; left: 50%; translate: -50% 0;
    width: 150px; height: 36px; border-radius: 18px; overflow: hidden;
    background: #000; transform-origin: 50% 0; /* hangs from the screen's top edge: it scales and swings from there */
    box-shadow: 0 0 0 .5px rgba(255,255,255,.09) inset, 0 12px 32px rgba(0,0,0,.32), 0 2px 6px rgba(0,0,0,.2);
    transition: width .62s var(--spring), height .62s var(--spring), border-radius .5s var(--ease), box-shadow .4s ease,
                scale .45s var(--spring), rotate .6s var(--spring), transform .9s var(--spring), opacity .35s ease;
  }
  #island.intro { opacity: 0; transform: translateY(-72px) scale(.45); }
  #pill.bye { padding: 0 18px 0 7px; gap: 12px; }
  .bye .hello-icons .icon { animation: doze .9s var(--ease) both; } /* each one hops, then droops and dims: nodding off */
  @keyframes doze { 0% { translate: 0 0; } 28% { translate: 0 -6px; } 100% { translate: 0 3px; filter: grayscale(.9) brightness(.55); } }
  .bye b { color: rgba(235, 235, 245, .85); }
  .zzz { position: relative; width: 26px; height: 20px; }
  .zzz i { position: absolute; left: 0; bottom: 1px; font: italic 700 11px/1 "SF Pro Display", "Segoe UI Variable Display", sans-serif;
           color: rgba(235, 235, 245, .85); opacity: 0; animation: snooze 1.3s ease-out both; }
  .zzz i:nth-child(2) { font-size: 14px; animation-delay: .22s; }
  .zzz i:nth-child(3) { font-size: 17px; animation-delay: .44s; }
  @keyframes snooze { 0% { opacity: 0; translate: 0 4px; scale: .6; } 35% { opacity: 1; } 100% { opacity: 0; translate: 12px -16px; scale: 1.1; } }
  #island:not(.open):hover { scale: 1.03; }
  #island.req:not(.open):hover { scale: 1.01; }
  #island.peek { border-radius: 24px; }
  #island.req { border-radius: 26px; }
  #island.open { border-radius: 30px; }
  /* Looping animations are stepped (~10-13 fps instead of 60): a transparent window is recomposited whole on every
     frame, so ambient motion at 60 fps cost a full CPU core. Stepped, these small loops look the same. */
  #island.alert:not(.open) { animation: breathe 2.6s steps(26) infinite; }
  #island.bump { animation: bump .6s var(--spring); }
  #island.alert.bump:not(.open) { animation: bump .6s var(--spring), breathe 2.6s ease-in-out infinite; }
  @keyframes bump { 30% { scale: 1.07 } 60% { scale: .985 } }
  @keyframes breathe {
    0%, 100% { box-shadow: 0 0 0 1px rgba(255,159,10,.28) inset, 0 8px 24px rgba(255,159,10,.12), 0 2px 6px rgba(0,0,0,.2); }
    50%      { box-shadow: 0 0 0 1px rgba(255,159,10,.6) inset, 0 10px 40px rgba(255,159,10,.34), 0 2px 6px rgba(0,0,0,.2); }
  }

  /* While agents work, a comet of light orbits the pill's edge */
  #island::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; pointer-events: none;
    background: conic-gradient(from var(--spin), transparent 0deg 240deg, rgba(10,132,255,.9) 315deg, rgba(191,90,242,.95) 342deg, transparent 360deg);
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); mask-composite: exclude;
    opacity: 0; transition: opacity .7s ease;
  }
  #island.busy::before { opacity: .9; animation: orbit 2.8s steps(36) infinite; } /* only while it's visible: hidden, it still repainted */
  @keyframes orbit { to { --spin: 360deg } }

  /* Collapsed: pill, transient peek, pending permission, or the welcome */
  #pill {
    position: absolute; top: 0; left: 50%; translate: -50% 0; min-height: 36px; padding: 0 15px 0 12px;
    display: flex; align-items: center; gap: 9px; white-space: nowrap;
    transition: opacity .25s ease, filter .3s ease, scale .4s var(--ease);
  }
  #island.open #pill { opacity: 0; filter: blur(6px); scale: .92; pointer-events: none; }
  #pill.ghost { pointer-events: none; }
  #pill.ghost, #pill.ghost * { animation: none !important; } /* a clone would otherwise replay its entrance animations */
  .cluster { display: flex; }
  .cluster .dot { width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 0 2px #000; }
  .cluster .dot + .dot { margin-left: -3px; }
  #pill b { font-weight: 600; font-size: 13px; letter-spacing: -.01em; }
  #pill .sub { color: var(--secondary); font-size: 12.5px; }
  #pill .warn { color: var(--orange); }
  #pill .ok { color: var(--green); }
  #pill .muted { color: var(--secondary); font-weight: 500; }
  #pill .roll { animation: roll .45s var(--ease); }
  @keyframes roll { from { translate: 0 8px; opacity: 0; filter: blur(3px); } }

  #pill.hello { padding: 0 17px 0 7px; gap: 12px; }
  .hello-icons { display: flex; gap: 5px; }
  .hello-icons .icon { width: 22px; height: 22px; border-radius: 6.5px; animation: pop .6s var(--spring) both; }
  .hello-text { display: flex; gap: 8px; align-items: baseline; animation: rise .6s var(--ease) .3s both; }
  .hello-text b { background: linear-gradient(90deg, #fff 0 38%, #A8D1FF 50%, #fff 62% 100%); background-size: 260% 100%;
                  -webkit-background-clip: text; background-clip: text; color: transparent; animation: shine 1.5s ease .7s both; }
  @keyframes pop { from { scale: .2; opacity: 0; } }
  @keyframes rise { from { translate: 0 6px; opacity: 0; filter: blur(4px); } }
  @keyframes shine { from { background-position: 100% 0; } to { background-position: 0 0; } }

  #pill.card { width: 380px; padding: 11px 14px 11px 11px; align-items: flex-start; gap: 11px; white-space: normal; }
  #pill.card.request { width: 420px; cursor: pointer; }
  #pill.card .icon { width: 30px; height: 30px; border-radius: 8.5px; animation: pop .55s var(--spring) both; }
  .card-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .card-body > * { animation: rise .5s var(--ease) both; }
  .card-body > :nth-child(2) { animation-delay: .05s; } .card-body > :nth-child(3) { animation-delay: .1s; } .card-body > :nth-child(4) { animation-delay: .15s; }
  .card-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .card-top b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-top span { color: var(--tertiary); font-size: 12px; flex: none; }
  .card-line { color: var(--secondary); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-top b.ok { color: var(--green); } .card-top b.no, .card-top b.bad { color: #FF6961; } .card-top b.warn { color: var(--orange); }

  /* Allowed / Denied confirmation badge: pops, then the stroke draws itself */
  .badge { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; animation: pop .55s var(--spring) both; }
  .badge.ok { background: rgba(48,209,88,.18); } .badge.no { background: rgba(255,69,58,.18); }
  .badge svg { width: 16px; height: 16px; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round;
               stroke-dasharray: 1; animation: draw .42s ease-out .14s both; }
  .badge.ok svg { stroke: var(--green); } .badge.no svg { stroke: var(--red); }
  @keyframes draw { from { stroke-dashoffset: 1; } }

  /* Permission request (in the card and in panel rows) */
  .code { font: 11.5px/1.45 var(--mono); color: rgba(255,255,255,.85); background: rgba(255,255,255,.07); border-radius: 8px;
          padding: 6px 8px; margin-top: 6px; white-space: pre-wrap; word-break: break-all;
          display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .actions { display: flex; gap: 8px; margin-top: 9px; }
  .actions button { height: 28px; padding: 0 14px; border-radius: 14px; font-size: 12.5px; font-weight: 600;
                    transition: background .15s ease, scale .35s var(--spring), color .15s ease; }
  .actions button:hover { scale: 1.04; }
  .actions button:active { scale: .93; transition-duration: .08s; }
  .actions .deny { background: rgba(255,255,255,.12); }
  .actions .deny:hover { background: rgba(255,69,58,.22); color: #FF6961; }
  .actions .allow { background: var(--blue); box-shadow: 0 4px 14px rgba(10,132,255,.35); }
  .actions .allow:hover { background: #409CFF; }
  .actions .all { background: none; color: var(--secondary); padding: 0 8px; margin-left: auto; box-shadow: none; }
  .actions .all:hover { color: #fff; }
  .actions kbd { font: 600 10px var(--mono); opacity: .55; margin-left: 5px; }

  /* Expanded panel */
  #panel {
    position: absolute; top: 0; left: 50%; translate: -50% 0; width: 460px;
    padding: 18px 16px 12px; max-height: 690px; overflow-y: auto;
    opacity: 0; filter: blur(8px); scale: .96; transform-origin: top center; pointer-events: none;
    visibility: hidden; /* once faded out, stop painting it: its spinners and timers would otherwise keep redrawing */
    transition: opacity .2s ease, filter .25s ease, scale .45s var(--ease), visibility 0s linear .45s;
  }
  #panel::-webkit-scrollbar { display: none; }
  #island.open #panel { opacity: 1; filter: none; scale: 1; pointer-events: auto; visibility: visible; transition-delay: .08s, .08s, .08s, 0s; }

  .head { display: flex; align-items: center; gap: 10px; padding: 0 6px 2px; }
  .head h1 { font: 600 17px/1.2 "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", sans-serif; letter-spacing: -.02em; }
  .head .summary { flex: 1; text-align: right; color: var(--secondary); font-size: 12px; }
  .round { width: 28px; height: 28px; border-radius: 50%; background: rgba(255,255,255,.1); display: grid; place-items: center;
           transition: background .15s ease, scale .35s var(--spring); }
  .round:hover { background: rgba(255,255,255,.18); scale: 1.08; }
  .round:active { scale: .9; transition-duration: .08s; }
  .round svg { width: 14px; height: 14px; }

  .group { margin-top: 14px; }
  .group > .title { display: flex; justify-content: space-between; padding: 0 8px 6px; font-size: 12px; font-weight: 600; color: var(--secondary); letter-spacing: .01em; }
  .group > .title span:last-child { color: var(--tertiary); font-weight: 500; }
  .list { background: var(--fill); border-radius: 16px; overflow: hidden; }

  .row { position: relative; display: flex; gap: 12px; padding: 11px 12px; overflow: hidden; transition: background .2s ease, scale .3s var(--spring); }
  .row.jump { cursor: pointer; }
  .row.jump:hover { background: rgba(255,255,255,.05); }
  .row.jump:active { background: rgba(255,255,255,.09); scale: .985; transition-duration: .1s; }
  .row.waiting { background: rgba(255,159,10,.08); }
  .row.sel { background: rgba(10,132,255,.14); box-shadow: 0 0 0 1.5px rgba(10,132,255,.8) inset; }
  .row + .row::before { content: ""; position: absolute; top: 0; left: 56px; right: 0; height: .5px; background: var(--sep); }

  .icon { position: relative; flex: none; width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center;
          box-shadow: 0 0 0 .5px rgba(255,255,255,.12) inset, 0 1px 2px rgba(0,0,0,.4); }
  .icon svg { width: 62%; height: 62%; }
  .row.unread .icon::after { content: ""; position: absolute; top: -3px; right: -3px; width: 10px; height: 10px; border-radius: 50%;
                             background: var(--blue); box-shadow: 0 0 0 2.5px #1c1c1e; animation: pop .5s var(--spring) both; }
  .claude { background: #F4EFE6; }
  .agy { background: linear-gradient(160deg, #24252B, #131418); }
  .opencode { background: linear-gradient(160deg, #262222, #121010); }
  .kilo { background: #0B0B0B; }
  .copilot { background: linear-gradient(160deg, #3B2A6B, #17112E); }
  .agy svg, .kilo svg { width: 80%; height: 80%; } /* these marks fill their tile in the originals */
  .other { background: linear-gradient(160deg, #636366, #3A3A3C); font-weight: 700; }
  .tag { margin-left: 7px; padding: 1px 6px; border-radius: 5px; background: rgba(255,255,255,.1); color: var(--secondary);
         font-size: 10.5px; font-weight: 600; letter-spacing: .01em; vertical-align: 1px; }

  .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .name { font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
  .task { color: rgba(255,255,255,.86); }
  .action, .task { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .action { color: var(--secondary); font-size: 12.5px; }
  .progress { display: flex; align-items: center; gap: 8px; margin-top: 5px; color: var(--secondary); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .track { flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,.1); overflow: hidden; }
  .track i { display: block; height: 100%; border-radius: 2px; background: var(--blue); }
  .row.working .track i { background: linear-gradient(90deg, var(--blue) 0 35%, #7CC0FF 50%, var(--blue) 65% 100%); background-size: 300% 100%; animation: flow 2.2s steps(22) infinite; }
  @keyframes flow { from { background-position: 100% 0; } to { background-position: -50% 0; } }

  .side { flex: none; display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; gap: 8px; }
  .status { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; transform-origin: right center; }
  .status.working { color: var(--blue); } .status.waiting { color: var(--orange); }
  .status.done { color: var(--green); } .status.idle { color: var(--gray); } .status.error { color: #FF6961; }
  .row.error { background: rgba(255,69,58,.08); }
  .row.error .action { color: #FF8A80; }
  .ind.error { width: 7px; height: 7px; background: var(--red); box-shadow: 0 0 0 3px rgba(255,69,58,.22); }
  #pill .bad { color: #FF6961; }
  .name .meta { margin-left: 7px; font-size: 11px; font-weight: 600; color: var(--tertiary); }
  .name .meta.warn { color: var(--orange); } .name .meta.bad { color: #FF6961; }

  /* Usage limits card */
  .limits { display: flex; align-items: center; gap: 18px; margin: 10px 0 0; padding: 7px 12px; border-radius: 12px; background: var(--fill); }
  .limits .who { flex: none; display: flex; align-items: center; }
  .limits .who .icon { width: 20px; height: 20px; border-radius: 6px; }
  .lim { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--secondary); }
  .lim b { color: #fff; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 30px; text-align: right; }
  .lim .when { color: var(--tertiary); font-size: 11px; white-space: nowrap; }
  .lim .track { flex: 1; height: 4px; }
  .lim .track i { transition: none; }
  .lim.warn .track i { background: var(--orange); } .lim.bad .track i { background: var(--red); }
  .controls { display: flex; align-items: center; gap: 10px; }
  .timer { color: var(--tertiary); font-size: 11.5px; font-variant-numeric: tabular-nums; min-width: 24px; text-align: right; }
  .row.waiting .timer { color: var(--orange); font-weight: 600; }
  .x { display: none; width: 18px; height: 18px; border-radius: 50%; padding: 0; background: rgba(255,255,255,.14);
       color: var(--secondary); font-size: 11px; line-height: 18px; transition: background .15s ease, scale .3s var(--spring); }
  .x:hover { background: rgba(255,255,255,.24); color: #fff; scale: 1.12; }
  .row:hover .timer { display: none; } .row:hover .x { display: block; }

  /* Status indicators; looping animations are phase-synced to the clock so re-renders don't restart them */
  .ind { flex: none; display: inline-block; border-radius: 50%; }
  .ind.working { width: 11px; height: 11px; border: 1.8px solid rgba(10,132,255,.25); border-top-color: var(--blue); animation: spin .9s steps(12) infinite; }
  .ind.waiting { width: 7px; height: 7px; background: var(--orange); animation: halo 1.6s steps(16) infinite; }
  .ind.done { width: 11px; height: 11px; border-radius: 0; }
  .ind.done svg { display: block; width: 100%; height: 100%; fill: none; stroke: var(--green); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; }
  .ind.idle { width: 6px; height: 6px; background: var(--gray); }
  @keyframes spin { to { rotate: 360deg } }
  @keyframes halo { 0% { box-shadow: 0 0 0 0 rgba(255,159,10,.6) } 80%, 100% { box-shadow: 0 0 0 6px rgba(255,159,10,0) } }
  .cluster .dot.waiting { animation: halo 1.6s steps(16) infinite; }

  /* iOS switch: the knob stretches while pressed, then springs across */
  .switch { background: none; padding: 0; border-radius: 6px; display: flex; align-items: center; gap: 6px; color: var(--tertiary); font-size: 11px; font-weight: 600; letter-spacing: .02em; cursor: pointer; transition: color .25s ease; }
  .switch .knob { position: relative; width: 34px; height: 20px; border-radius: 10px; background: rgba(120,120,128,.36); transition: background .25s ease; }
  .switch .knob::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 8px; background: #fff;
                         box-shadow: 0 2px 4px rgba(0,0,0,.3); transition: translate .38s var(--spring), width .22s var(--ease); }
  .switch:active .knob::after { width: 21px; }
  .switch.on { color: var(--green); }
  .switch.on .knob { background: var(--green); }
  .switch.on .knob::after { translate: 14px 0; }
  .switch.on:active .knob::after { translate: 9px 0; }

  .empty { padding: 26px 0 18px; text-align: center; color: var(--secondary); }
  .empty b { display: block; color: var(--label); font-size: 14px; font-weight: 600; margin-bottom: 3px; }
  .foot { display: flex; align-items: center; gap: 4px; padding: 12px 8px 0; color: var(--tertiary); font-size: 11.5px; }
  .foot > span { flex: 1; }
  .foot button { background: none; color: var(--tertiary); padding: 2px 6px; border-radius: 6px; transition: background .15s ease, color .15s ease; }
  .foot button:hover { color: var(--secondary); background: rgba(255,255,255,.06); }
  .keys { padding: 10px 8px 0; color: var(--tertiary); font-size: 11px; text-align: center; }
  .keys { line-height: 2; }
  .keys .anywhere { color: var(--tertiary); opacity: .8; }
  .keys kbd { font: 600 10px var(--mono); color: var(--secondary); background: rgba(255,255,255,.08); border-radius: 4px; padding: 1px 4px; }

  /* Rename */
  .name input { width: 230px; margin-left: -6px; padding: 1px 6px; border: 0; outline: 0; border-radius: 6px; font: inherit; color: #fff;
                background: rgba(255,255,255,.1); box-shadow: 0 0 0 1.5px rgba(10,132,255,.75) inset; user-select: text; }
  .name input::placeholder { color: var(--tertiary); }

  /* Launcher */
  .group > .title .right { display: flex; align-items: center; gap: 8px; }
  .gplus { width: 18px; height: 18px; border-radius: 50%; padding: 0; background: rgba(255,255,255,.1); color: var(--secondary);
           font-size: 13px; line-height: 18px; opacity: 0; scale: .7; transition: opacity .2s ease, scale .35s var(--spring), background .15s ease; }
  .group:hover .gplus { opacity: 1; scale: 1; }
  .gplus:hover { background: rgba(10,132,255,.35); color: #fff; }
  .stack { display: flex; }
  .stack .icon { box-shadow: 0 0 0 2px #000; }
  .stack .icon + .icon { margin-left: -12px; }
  .chipcol { display: flex; flex-direction: column; gap: 6px; }
  .step { display: flex; align-items: center; justify-content: center; gap: 4px; visibility: hidden; }
  .step.on { visibility: visible; }
  .step button { width: 24px; height: 22px; border-radius: 11px; background: rgba(255,255,255,.12); font-size: 15px; font-weight: 700; line-height: 1; }
  .step button:hover { background: rgba(255,255,255,.2); } .step button:active { scale: .9; }
  .step span { min-width: 20px; text-align: center; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 16px 0 12px; }
  .chip { display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 12px 6px 10px; border-radius: 14px; background: var(--fill);
          color: var(--secondary); font-size: 12px; font-weight: 600; transition: background .2s ease, color .2s ease, box-shadow .25s ease, scale .35s var(--spring); }
  .chip:hover { background: rgba(118,118,128,.26); color: #fff; }
  .chip:active { scale: .94; transition-duration: .08s; }
  .chip.on { background: rgba(10,132,255,.16); color: #fff; box-shadow: 0 0 0 1.5px var(--blue) inset; }
  .chip .icon { width: 34px; height: 34px; border-radius: 9.5px; filter: saturate(.3) brightness(.7); transition: filter .25s ease, scale .4s var(--spring); }
  .chip.on .icon { filter: none; scale: 1.08; }
  .field { width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--fill); text-align: left; transition: background .2s ease; }
  .field:hover { background: rgba(118,118,128,.26); }
  .field svg { flex: none; width: 15px; height: 15px; }
  .field b { font-size: 13px; font-weight: 600; white-space: nowrap; }
  .field .fpath { flex: 1; min-width: 0; color: var(--tertiary); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .field .chev { transition: rotate .4s var(--spring); }
  .field.open .chev { rotate: 180deg; }
  .folders { margin-top: 6px; background: var(--fill); border-radius: 12px; max-height: 210px; overflow-y: auto; }
  .folders::-webkit-scrollbar { display: none; }
  .folders button { width: 100%; display: flex; gap: 10px; align-items: baseline; padding: 8px 12px; background: none; text-align: left; transition: background .15s ease; }
  .folders button:hover { background: rgba(255,255,255,.06); }
  .folders button + button { box-shadow: 0 -.5px 0 var(--sep); }
  .folders b { font-weight: 600; white-space: nowrap; }
  .folders span { color: var(--tertiary); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .folders .browse b { color: var(--blue); }

                     background: var(--fill); color: #fff; font: inherit; font-size: 13px; line-height: 1.45; user-select: text; box-shadow: 0 0 0 1.5px transparent inset;
                     transition: box-shadow .25s ease, background .2s ease; }
  .launch textarea:focus { background: rgba(118,118,128,.24); box-shadow: 0 0 0 1.5px rgba(10,132,255,.75) inset; }
  .launch textarea::placeholder { color: var(--tertiary); }
  .opts { display: flex; align-items: center; gap: 16px; margin-top: 12px; padding: 0 2px; }
  .go { margin-left: auto; height: 32px; padding: 0 16px; border-radius: 16px; background: var(--blue); font-size: 13px; font-weight: 600;
        box-shadow: 0 6px 18px rgba(10,132,255,.35); transition: background .15s ease, scale .35s var(--spring), opacity .2s ease, box-shadow .2s ease; }
  .go:hover { background: #409CFF; scale: 1.04; }
  .go:active { scale: .93; transition-duration: .08s; }
  .go:disabled { opacity: .35; cursor: default; scale: 1; box-shadow: none; }
  .go.busy { animation: busy 1s ease-in-out infinite; }
  @keyframes busy { 50% { opacity: .55; } }
  .go kbd { font: 600 10px var(--mono); opacity: .6; margin-left: 7px; }
  .err { margin-top: 10px; padding: 8px 12px; border-radius: 10px; background: rgba(255,69,58,.14); color: #FF6961; font-size: 12px; }
  .err:empty { display: none; }

  /* Quiet list: the AUTO switch shows when you hover, when it's on, or when the agent needs you; the rest lives in the ⋯ menu */
  .controls .switch:not(.on) { opacity: 0; transition: opacity .2s ease, color .25s ease; }
  .row:hover .controls .switch, .row.waiting .controls .switch, .row.sel .controls .switch { opacity: 1; }
  .menu { position: absolute; top: 50px; right: 16px; z-index: 5; min-width: 232px; padding: 5px; border-radius: 14px; background: #2c2c2e;
          box-shadow: 0 0 0 .5px rgba(255,255,255,.12) inset, 0 14px 36px rgba(0,0,0,.5); }
  .menu.enter { animation: rise .25s var(--ease) .32s both; } /* only on opening, after a short panel has sprung open: until then it would be clipped */
  .menu button { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 18px; padding: 8px 10px; border-radius: 9px; background: none; text-align: left; }
  .menu button:hover { background: rgba(255,255,255,.08); }
  .menu button.danger { color: #FF6961; }
  .menu kbd { font: 600 10px var(--mono); color: var(--tertiary); }

  .foot .clear { color: var(--secondary); }

  button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .chip:focus-visible, .field:focus-visible, .folders button:focus-visible { outline-offset: -2px; }

  /* Shortcuts sheet */
  .help h2 { margin: 16px 8px 6px; font-size: 12px; font-weight: 600; color: var(--secondary); letter-spacing: .01em; }

  .setup .intro { padding: 12px 8px 2px; color: var(--secondary); font-size: 12.5px; line-height: 1.45; }
  .srow { display: flex; align-items: center; gap: 12px; padding: 10px 12px; }

  .srow .sbody { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .srow b { font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
  .srow .sub { color: var(--tertiary); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .pairing img { width: 136px; height: 136px; flex: none; border-radius: 10px; background: #fff; image-rendering: pixelated; }
  .pairing .how { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 7px; font-size: 11.5px; color: var(--secondary); }
  .pairing code { font: 10.5px/1.4 var(--mono); color: var(--label); user-select: text; word-break: break-all; }
  .pairing button { height: 26px; padding: 0 12px; border-radius: 13px; background: rgba(255,255,255,.12); font-size: 12px; font-weight: 600; }
  .switch:disabled { cursor: default; opacity: .5; }
  .setup .finish { display: flex; justify-content: flex-end; margin-top: 14px; }

  /* Idle animation: tendrils (black) under the pill, escaping agents under the tendrils */
  #island { z-index: 2; }
  .update { display: flex; align-items: center; gap: 12px; margin: 12px 0 0; padding: 10px 12px; border-radius: 14px; background: rgba(10,132,255,.14); box-shadow: 0 0 0 1px rgba(10,132,255,.4) inset; }
  .update .sbody { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .update b { font-size: 13px; font-weight: 600; } .update .sub { color: var(--secondary); font-size: 11.5px; }
  .mini { flex: none; height: 26px; padding: 0 12px; border-radius: 13px; background: rgba(255,255,255,.12); font-size: 12px; font-weight: 600; }

  #pill, .head { cursor: grab; }
  #island.dragging, #island.dragging * { cursor: grabbing !important; }
  /* Picked up: it lifts a little, its shadow deepens and a faint blue edge shows; the swing is set from the pointer's speed */
  #island.dragging, #island.dragging:not(.open):hover { scale: 1.05; box-shadow: 0 0 0 1px rgba(10,132,255,.4) inset, 0 22px 54px rgba(0,0,0,.5), 0 4px 10px rgba(0,0,0,.25); }
  #venom { position: fixed; inset: 0; z-index: 1; display: none; pointer-events: none; }
  #venom svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  #venom path, #venom rect { fill: #000; }
  #eyes { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 7px; opacity: 0; pointer-events: none; transition: opacity .25s ease; }
  #island.eyed #eyes { opacity: 1; }
  #island.eyed #pill { opacity: 0; }
  #eyes i { position: relative; width: 12px; height: 16px; border-radius: 50%; background: #fff; overflow: hidden; }
  #eyes b { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: #000; transform: translate(var(--px, 0px), var(--py, 0px)); transition: transform .08s linear; }
  #venom .vlogo { position: absolute; left: 0; top: 0; width: 22px; height: 22px; border-radius: 6px; will-change: transform; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 1ms !important; animation-delay: 0ms !important; transition-duration: 1ms !important; }
  }
</style>
</head>

    })
    later(1550, () => anim(island, [ // wind-up dip, then it stretches tall and shoots up into the screen edge
      { transform: 'translateY(0) scale(1, 1)', opacity: 1 },
      { transform: 'translateY(5px) scale(1.18, .8)', opacity: 1, offset: .32 },
      { transform: 'translateY(-60px) scale(.62, 1.45)', opacity: 1, offset: .82 },
      { transform: 'translateY(-96px) scale(.4, 1.6)', opacity: 0 },
    ], { duration: 460, easing: 'cubic-bezier(.5, 0, .75, 0)', fill: 'forwards' }))
    later(2100, () => notch.send('goodbye-done'))
  })
})

function lullaby() { // goodbye: the welcome chime, falling
  if (!sound) return
  const ctx = audio(), t = ctx.currentTime
  for (const [f, d] of [[1318.5, 0], [880, .14], [659.3, .3]]) {
    const o = ctx.createOscillator(), g = ctx.createGain()
    o.type = 'sine'; o.frequency.value = f
    g.gain.setValueAtTime(0, t + d); g.gain.linearRampToValueAtTime(.08, t + d + .015); g.gain.exponentialRampToValueAtTime(.0001, t + d + .7)
    o.connect(g).connect(ctx.destination); o.start(t + d); o.stop(t + d + .75)
  }
}

function chime() { // needs you: soft two-note rise
  if (!sound || (asleep && !sessions.some(s => s.state === 'waiting' || s.request))) return
  const ctx = audio(), t = ctx.currentTime
  for (const [f, d] of [[880, 0], [1318.5, .1]]) {
    const o = ctx.createOscillator(), g = ctx.createGain()
    o.type = 'sine'; o.frequency.value = f
    g.gain.setValueAtTime(0, t + d); g.gain.linearRampToValueAtTime(.11, t + d + .012); g.gain.exponentialRampToValueAtTime(.0001, t + d + .6)
    o.connect(g).connect(ctx.destination); o.start(t + d); o.stop(t + d + .65)
  }
}
function tick(high = true) { // allow / deny: a short tactile click
  if (!sound) return
  const ctx = audio(), t = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain()
  o.frequency.setValueAtTime(high ? 1600 : 520, t); o.frequency.exponentialRampToValueAtTime(high ? 950 : 300, t + .06)
  g.gain.setValueAtTime(.07, t); g.gain.exponentialRampToValueAtTime(.0001, t + .09)
  o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + .1)
}

// A brief confirmation card on the pill: { lead(), title(), right, line }
function showToast(t, ms = RESOLVED_MS) {
  toast = { id: Date.now(), ...t }
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { toast = null; render() }, ms)
  render()
}
function badge(ok) { const b = el('div', 'badge ' + (ok ? 'ok' : 'no')); b.innerHTML = ok ? CHECK : CROSS; return b }
function stack(agents) {
  const s = el('div', 'stack')
  agents.forEach((a, i) => { const ic = icon(a); ic.style.animationDelay = i * 70 + 'ms'; s.append(ic) })
  return s
}

function decideUI(s, choice) {
  notch.send('decide', s.key, choice)
  tick(choice !== 'deny')
  const ok = choice !== 'deny'
  showToast({
    lead: () => badge(ok), right: s.project, line: `${name(s)} · ${s.request?.detail || s.request?.title || s.action}`,
    title: () => el('b', ok ? 'ok' : 'no', choice === 'all' ? 'Allowed · AUTO on' : ok ? 'Allowed' : 'Denied'),
  })
}

function requestActions(s, withAll) {
  const a = el('div', 'actions')
  const deny = el('button', 'deny', 'Deny'), allow = el('button', 'allow', 'Allow')
  if (keyboard) { deny.append(el('kbd', '', 'N')); allow.append(el('kbd', '', 'Y')) }
  deny.onclick = e => { e.stopPropagation(); decideUI(s, 'deny') }
  allow.onclick = e => { e.stopPropagation(); decideUI(s, 'allow') }
  a.append(deny, allow)
  if (withAll) {
    const all = el('button', 'all', 'Allow all'); all.title = 'Allow this and turn on AUTO for this agent'
    all.onclick = e => { e.stopPropagation(); decideUI(s, 'all') }
    a.append(all)
  }
  return a
}

function card(lead, top, right, line, extra) {
  const body = el('div', 'card-body'), head = el('div', 'card-top')
  head.append(top instanceof Node ? top : el('b', '', top), el('span', '', right))
  body.append(head)
  if (line) body.append(el('div', 'card-line', line))
  if (extra) body.append(...extra)
  return [lead, body]
}

// Picks what the collapsed island shows. Returns a signature so the DOM (and its entrance animations) only rebuilds on real change.
function pillView() {
  const waiting = sessions.filter(s => s.state === 'waiting'), working = sessions.filter(s => s.state === 'working')
  const unread = sessions.filter(s => s.state === 'done' && s.unread)
  const req = sessions.filter(s => s.request).sort((a, b) => a.since - b.since)[0]

  if (farewell === 'dot') return { mode: 'drop', sig: 'bye-dot', build: () => [] }
  if (farewell) return {
    mode: 'bye', sig: 'bye', cls: 'bye', build: () => {
      const icons = el('span', 'hello-icons')
      Object.keys(GLYPH).forEach((a, i) => { const ic = icon(a); ic.style.animationDelay = 80 + i * 90 + 'ms'; icons.append(ic) })
      const zzz = el('span', 'zzz'); zzz.append(el('i', '', 'z'), el('i', '', 'z'), el('i', '', 'Z'))
      return [icons, el('b', '', farewell === 'reload' ? 'Be right back' : 'Goodnight'), zzz]
    },
  }
  if (welcome === 'drop') return { mode: 'drop', sig: 'drop', build: () => [] }
  if (welcome === 'hello') return {
    mode: 'hello', sig: 'hello', cls: 'hello', build: () => {
      const icons = el('span', 'hello-icons')
      Object.keys(GLYPH).forEach((a, i) => { const ic = icon(a); ic.style.animationDelay = 30 + i * 70 + 'ms'; icons.append(ic) })
      const text = el('span', 'hello-text')
      text.append(el('b', '', 'Notch'), el('span', 'sub', 'watching your agents'))
      return [icons, text]
    },
  }
  if (toast) return { mode: 'toast', sig: 'toast' + toast.id, cls: 'card', build: () => card(toast.lead(), toast.title(), toast.right, toast.line) }
  if (req) return {
    mode: 'req', sig: 'req' + req.key + req.request.title + req.request.detail + keyboard, cls: 'card request', build: () =>
      card(icon(req.agent), `${name(req)} · ${req.request.title}`, req.project, null, [el('div', 'code', req.request.detail || req.action), requestActions(req, false)]),
  }
  if (asleep && !waiting.length) return { mode: 'sleep', sig: 'sleep', cls: 'asleep', build: () => [el('span', 'sleepz', 'zzz')] }
  if (peek) {
    const s = peek, verb = s.state === 'waiting' ? 'needs you' : s.state === 'error' ? 'stopped' : 'finished', line = s.state === 'done' ? (s.task || s.action) : s.action
    return { mode: 'peek', sig: 'peek' + s.key + s.state + line, cls: 'card', build: () => card(icon(s.agent), `${name(s)} ${verb}`, s.project, line) }
  }

  let label
  const failed = sessions.filter(s => s.state === 'error')
  if (waiting.length) label = [['b', 'warn', `${name(waiting[0])} needs you`], ['span', 'sub', waiting.length > 1 ? `+${waiting.length - 1} more` : waiting[0].project]]
  else if (failed.length) label = [['b', 'bad', `${name(failed[0])}: ${failed[0].action.split(' · ')[0]}`], ['span', 'sub', failed.length > 1 ? `+${failed.length - 1} more` : failed[0].project]]
  else if (working.length) label = [['b', '', `${working.length} working`], ...(unread.length ? [['span', 'sub', `${unread.length} finished`]] : [])]
  else if (unread.length) label = [['b', 'ok', `${unread.length} finished`]]
  else if (sessions.some(s => s.state === 'done')) label = [['b', 'ok', 'All done']]
  else label = [['b', 'muted', sessions.length ? plural(sessions.length, 'agent') : 'No agents']]
  const dots = [...sessions].sort(byRank).slice(0, 4)
  return {
    mode: 'pill', sig: 'pill' + JSON.stringify(label) + dots.map(s => s.agent + s.state).join(), busy: working.length && !waiting.length, build: () => {
      const cluster = el('span', 'cluster')
      for (const s of dots) {
        const d = synced(el('span', 'dot ' + s.state), 1600)
        d.style.background = DOT[s.agent] || '#8E8E93'
        cluster.append(d)
      }
      if (!dots.length) cluster.append(Object.assign(el('span', 'dot'), { style: 'background:#3A3A3C' }))
      return [cluster, ...label.map(([t, c, x]) => el(t, c, x))]
    },
  }
}

function renderPill() {
  const v = pillView()
  if (v.sig !== pillSig) {
    const sameMode = v.mode === mode
    if (!sameMode && pill.childNodes.length && !calm) { // crossfade: the old content blurs away as the island reshapes
      const ghost = pill.cloneNode(true) // keeps id="pill" for its styles; gone in 260ms
      ghost.classList.add('ghost')
      island.append(ghost)
      anim(ghost, [{ opacity: 1, filter: 'blur(0px)', scale: 1 }, { opacity: 0, filter: 'blur(8px)', scale: .86 }], { duration: 260, fill: 'forwards' }).onfinish = () => ghost.remove()
    }
    pill.className = v.cls || ''
    pill.replaceChildren(...v.build())
    if (!sameMode) anim(pill, [{ opacity: 0, filter: 'blur(8px)', scale: 1.08 }, { opacity: 1, filter: 'blur(0px)', scale: 1 }], { duration: 440, delay: 70, fill: 'backwards' })
    else if (v.mode === 'pill') for (const e of pill.querySelectorAll('b, .sub')) e.classList.add('roll') // counts slide in
    pillSig = v.sig; mode = v.mode
  }
  island.classList.toggle('peek', v.mode === 'peek' || v.mode === 'toast')
  island.classList.toggle('req', v.mode === 'req')
  island.classList.toggle('asleep', v.mode === 'sleep')
  island.classList.toggle('busy', !!v.busy && !open)

  const waiting = sessions.filter(s => s.state === 'waiting')
  island.classList.toggle('alert', waiting.length > 0)
  const fresh = waiting.some(s => !seenWaiting.has(s.key))
  seenWaiting = new Set(waiting.map(s => s.key))
  if (fresh) { chime(); island.classList.remove('bump'); void island.offsetWidth; island.classList.add('bump') }
}

function leave(r, key) { // collapse a row away, then drop the session
  anim(r, [{ height: r.offsetHeight + 'px', opacity: 1 }, { height: '0px', opacity: 0, paddingTop: '0px', paddingBottom: '0px' }], { duration: 300, fill: 'forwards' })
  setTimeout(() => notch.send('dismiss', key), calm ? 0 : 290)
}

function row(s, index) {
  const r = el('div', `row ${s.state}${s.hwnd ? ' jump' : ''}${s.unread ? ' unread' : ''}${keyboard && index === sel ? ' sel' : ''}`)
  r.dataset.key = s.key
  r.title = s.app ? `Open ${agentName(s)} app` : s.hwnd ? 'Open terminal' : 'No window (background session)'
  r.onclick = () => s.hwnd && notch.send('focus', s.key)

  const body = el('div', 'body'), title = el('div', 'name', name(s))
  if (s.app) r.title += ` (${APP_TAG[s.appName] || 'App'})`
  // Only what needs a look: context shows up once it's filling, and rename is a double-click (or R)
  if (typeof s.context === 'number' && s.context >= 70) title.append(Object.assign(el('span', 'meta' + (s.context >= 90 ? ' bad' : ' warn'), s.context + '% context'), { title: 'How full this session\'s context window is' }))
  title.title = 'Double-click to rename'
  title.ondblclick = e => { e.stopPropagation(); startRename(s, title) }
  body.append(title)
  // One line: what it's doing while it works or has stopped, what you asked once it's finished
  const line = s.state === 'done' || s.state === 'idle' ? s.task || s.action : s.action || s.task
  if (line && !s.request) body.append(el('div', 'action', line)) // a pending request already says what it wants
  if (s.request) body.append(el('div', 'code', s.request.detail || s.request.title), requestActions(s, true))
  if (s.state === 'working' && s.todos && s.todos.total) {
    const p = el('div', 'progress'), t = el('div', 'track'), fill = synced(el('i'), 2200)
    const pct = 100 * s.todos.done / s.todos.total, from = prevPct[s.key] ?? pct
    fill.style.width = pct + '%'
    if (from !== pct) anim(fill, [{ width: from + '%' }, { width: pct + '%' }], { duration: 750 }) // bar grows from where it was
    prevPct[s.key] = pct
    t.append(fill); p.append(t, el('span', '', `${s.todos.done} of ${s.todos.total}`))
    body.append(p)
  }

  const status = el('div', 'status ' + s.state), ind = indicator(s.state)
  status.append(ind, STATUS[s.state])
  if (changed.has(s.key)) { // state just changed: pop the status, draw the check, flash amber for "needs you"
    anim(status, [{ scale: .55, opacity: .2 }, { scale: 1, opacity: 1 }], { duration: 600, easing: SPRING })
    if (s.state === 'done') anim(ind.querySelector('path'), [{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }], { duration: 450, delay: 150, fill: 'backwards', easing: 'ease-out' })
    if (s.state === 'waiting') anim(r, [{ background: 'rgba(255,159,10,.3)' }, { background: 'rgba(255,159,10,.08)' }], { duration: 1100, easing: 'ease-out' })
  }
  if (known && !known.has(s.key)) anim(r, [{ opacity: 0, translate: '0 -8px', scale: .97 }, { opacity: 1, translate: '0 0', scale: 1 }], { duration: 520 })

  const sw = el('button', 'switch' + (s.auto ? ' on' : '')); sw.append('AUTO', el('span', 'knob'))
  sw.setAttribute('role', 'switch'); sw.setAttribute('aria-checked', !!s.auto)
  sw.title = 'Auto-approve permissions for this agent'
  sw.onclick = e => { e.stopPropagation(); tick(!s.auto); notch.send('auto', s.key, !s.auto) }
  const x = el('button', 'x', '✕'); x.title = 'Dismiss'
  x.onclick = e => { e.stopPropagation(); leave(r, s.key) }
  // AUTO needs a way to approve: no permission hook in Copilot, and no terminal prompt to press Enter on in Antigravity's IDE
  const canAuto = s.agent !== 'copilot' && !(s.agent === 'agy' && s.app)
  const controls = el('div', 'controls'); controls.append(...(canAuto ? [sw] : []), timerEl(s.since || s.updated), x)
  const side = el('div', 'side'); side.append(status, controls)

  r.append(icon(s.agent), body, side)
  return r
}

// Claude's 5-hour and weekly limits (from its status line), shown when known.
function limitsCard() {
  const c = limits.claude
  if (!c || (!c.five && !c.week)) return null
  const card = el('div', 'limits'), who = el('div', 'who'); who.append(icon('claude')); card.append(who)
  const clock = s => new Date(s * 1000).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })
  const day = s => new Date(s * 1000).toLocaleDateString([], { weekday: 'short' })
  for (const [label, w, when] of [['5h', c.five, w => 'resets ' + clock(w.resets_at)], ['Week', c.week, w => 'resets ' + day(w.resets_at)]]) {
    if (!w) continue
    const pct = Math.round(w.used_percentage), lim = el('div', 'lim' + (pct >= 90 ? ' bad' : pct >= 70 ? ' warn' : ''))
    const track = el('div', 'track'), fill = el('i')
    fill.style.width = Math.min(100, pct) + '%'; track.append(fill)
    lim.title = label + ' limit, ' + when(w)
    lim.append(el('span', '', label), track, el('b', '', pct + '%'))
    if (pct >= 70) lim.append(el('span', 'when', when(w))) // the reset time only matters once you're close
    card.append(lim)
  }
  return card
}

// One heads-up per window per level as Claude's limits fill (80%, then 95%).
function warnLimits() {
  const c = limits.claude
  if (!c) return
  for (const [key, label, w] of [['five', '5-hour', c.five], ['week', 'weekly', c.week]]) {
    if (!w) continue
    const level = w.used_percentage >= 95 ? 95 : w.used_percentage >= 80 ? 80 : 0
    const id = key + w.resets_at
    if (level > (warned[id] || 0)) {
      warned[id] = level
      const when = new Date(w.resets_at * 1000).toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' })
      chime()
      if (level >= 95) setTimeout(() => react('grumpy'), 800) // nearly out of Claude: it shakes with worry
      showToast({ lead: () => icon('claude'), title: () => el('b', level >= 95 ? 'bad' : 'warn', `Claude at ${Math.round(w.used_percentage)}% of your ${label} limit`), right: '', line: 'Resets ' + when }, 5000)
    }
  }
}

function renderPanel() {
  if (view !== 'list' || editing) return // built once and updated in place, so typing survives agent updates
  const n = st => sessions.filter(s => s.state === st).length
  const head = el('div', 'head')
  const add = el('button', 'round'); add.innerHTML = PLUS_ICON; add.title = 'New agent'
  add.onclick = () => openLauncher()
  const more = el('button', 'round'); more.innerHTML = MORE_ICON; more.title = 'More'
  more.onclick = e => { e.stopPropagation(); setMenu(!menuOpen) }
  const summary = [n('waiting') && `${n('waiting')} need you`, n('error') && `${n('error')} stopped`, n('working') && `${n('working')} working`, n('done') && `${n('done')} done`].filter(Boolean).join(' · ')
  head.append(el('h1', '', 'Agents'), el('span', 'summary', summary), add, more)

  const groups = {}
  for (const s of sessions) (groups[s.cwd || s.project] ||= []).push(s)
  const sorted = Object.values(groups).map(g => g.sort(byRank)).sort((a, b) => byRank(a[0], b[0]))
  ordered = sorted.flat()
  sel = Math.min(sel, Math.max(0, ordered.length - 1))

  let i = 0
  const content = sorted.map(g => {
    const group = el('div', 'group'), title = el('div', 'title'), list = el('div', 'list')
    title.title = g[0].cwd
    const right = el('span', 'right'), plus = el('button', 'gplus', '+')
    plus.title = 'New agent in ' + g[0].project
    plus.onclick = () => openLauncher(g[0].cwd)
    right.append(el('span', '', g.length > 1 ? plural(g.length, 'agent') : ''), plus)
    title.append(el('span', '', g[0].project), right)
    list.append(...g.map(s => row(s, i++)))
    group.append(...(sorted.length > 1 ? [title] : []), list) // a project heading only helps when there's more than one
    if (sorted.length === 1) group.style.marginTop = '12px'
    return group
  })
  if (!sessions.length) {
    const e = el('div', 'empty'), start = el('button', 'go', 'New agent')
    start.style.marginTop = '14px'; start.onclick = () => openLauncher()
    e.append(el('b', '', 'No agents running'), 'Start one here, or run claude, agy, opencode or kilo in any terminal.', el('br'), start)
    content.push(e)
  }

  // The footer is just a count and, when there's something to clear, one button; everything else is in the ⋯ menu
  const foot = el('div', 'foot'), clear = el('button', 'clear', 'Clear finished')
  clear.onclick = () => panel.querySelectorAll('.row.done').forEach((r, i) => setTimeout(() => leave(r, r.dataset.key), i * 45))
  foot.append(el('span', '', sessions.length ? `${plural(sessions.length, 'agent')}${sorted.length > 1 ? ' · ' + plural(sorted.length, 'project') : ''}` : ''), ...(n('done') ? [clear] : []))

  const menu = el('div', menuFresh ? 'menu enter' : 'menu'); menuFresh = false
  const item = (label, keys, fn, cls = '') => {
    const b = el('button', cls, label); if (keys) b.append(el('kbd', '', keys))
    b.onclick = e => { e.stopPropagation(); setMenu(false); fn() }
    return b
  }
  menu.append(
    item('Tile agent windows', 'Ctrl+Alt+G', () => notch.send('grid')),
    item(sound ? 'Sound: on' : 'Sound: off', 'S', () => { sound = !sound; try { localStorage.setItem('sound', sound ? 'on' : 'off') } catch {}; tick(); render() }),
    item(asleep ? 'Wake' : 'Sleep', 'Ctrl+Alt+Z', () => { const next = !asleep; if (keyboard) closeKeyboard(); setAsleep(next); if (next) setOpen(false) }),
    item('Shortcuts', 'I', () => openHelp()),
    item('Setup', ',', () => openSetup(false)),
    el('hr'),
    item('Reload', 'Ctrl+Alt+R', () => notch.send('reload')),
    item('Quit', 'Ctrl+Alt+Q', () => notch.send('quit'), 'danger'))

  const extra = []
  if (keyboard) {
    const k = el('div', 'keys')
    k.innerHTML = '<kbd>↑↓</kbd> select &nbsp; <kbd>↵</kbd> open &nbsp; <kbd>Y</kbd>/<kbd>N</kbd> allow / deny &nbsp; <kbd>I</kbd> all shortcuts &nbsp; <kbd>esc</kbd> close'
    extra.push(k)
  }
  const lc = limitsCard()
  panel.style.minHeight = menuOpen ? '340px' : '' // a short list still has to fit the menu, which hangs below the header
  panel.replaceChildren(head, ...(lc ? [lc] : []), ...(upd.status === 'ready' ? [updateCard()] : []), ...content, foot, ...extra, ...(menuOpen ? [menu] : []))
}
let menuFresh = false
function setMenu(v) { menuOpen = menuFresh = v; renderPanel(); layout() }
panel.addEventListener('click', e => { if (menuOpen && !e.target.closest('.menu')) setMenu(false) }) // click anywhere else closes the menu
panel.addEventListener('scroll', () => { if (menuOpen) setMenu(false) }) // it hangs off the header, so it can't follow the list

function startRename(s, title) {
  if (editing) return
  editing = s.key
  if (!keyboard) notch.send('grab-focus')
  const input = el('input'); input.value = s.label || ''; input.placeholder = agentName(s) + ' · ' + s.project; input.maxLength = 40
  title.replaceChildren(input)
  anim(input, [{ opacity: 0, scale: .96 }, { opacity: 1, scale: 1 }], { duration: 260 })
  input.focus(); input.select()
  let done = false
  const finish = save => {
    if (done) return
    done = true; editing = null
    if (save) { notch.send('rename', s.key, input.value); tick() }
    if (!keyboard && view !== 'launch') notch.send('keyboard-closed')
    render()
  }
  input.onkeydown = e => { e.stopPropagation(); if (e.key === 'Enter') finish(true); if (e.key === 'Escape') finish(false) }
  input.onclick = e => e.stopPropagation()
  input.onblur = () => finish(true)
}

// Setup: connect agents (each switch adds or removes the notch's hook in that agent's own config), start with Windows.
async function openSetup(first) {
  const st = await notch.invoke('setup-status')
  let firstErr = ''
  if (first) for (const a of Object.keys(GLYPH)) { // new users forgetting a switch means agents that never show up: start with every installed one on
    if (!st.agents[a].installed || st.agents[a].connected) continue
    const res = await notch.invoke('setup-connect', a, true)
    if (res.error) firstErr = res.error; else st.agents[a] = res.agents[a]
  }
  view = 'setup'
  const head = el('div', 'head')
  if (!first) { const back = el('button', 'round'); back.innerHTML = BACK_ICON; back.title = 'Back (Esc)'; back.onclick = () => closeSetup(); head.append(back) }
  head.append(el('h1', '', first ? 'Welcome to Notch' : 'Setup'), el('span', 'summary', ''))
  const intro = el('div', 'intro', 'Notch follows your agents through a small hook in each one\'s own settings. The ones it found are already on; turn off any you don\'t want. Restart a running agent so it picks the hook up.')
  const err = el('div', 'err', firstErr)

  const agents = el('div', 'list')
  for (const a of Object.keys(GLYPH)) {
    let info = st.agents[a]

  const prefs = el('div', 'list'), login = el('div', 'srow'), lbody = el('div', 'sbody')
  let loginOn = st.login
  const lsw = el('button', 'switch' + (loginOn ? ' on' : '')); lsw.append(el('span', 'knob')); lsw.setAttribute('role', 'switch'); lsw.setAttribute('aria-checked', loginOn)
  lsw.onclick = async () => { loginOn = await notch.invoke('setup-login', !loginOn); lsw.classList.toggle('on', loginOn); lsw.setAttribute('aria-checked', loginOn); tick(loginOn) }
  lbody.append(el('b', '', 'Start with Windows'), el('span', 'sub', 'Otherwise it starts the first time an agent does something'))
  login.append(lbody, lsw)
  // Claude usage limits come through Claude's status line; never offered over a status line you set up yourself
  const lim = el('div', 'srow'), limBody = el('div', 'sbody'), limSub = el('span', 'sub')
  let limState = st.agents.limits
  const limSw = el('button', 'switch'); limSw.append(el('span', 'knob')); limSw.setAttribute('role', 'switch')
  const paintLim = () => {
    limSw.classList.toggle('on', limState === 'ours'); limSw.setAttribute('aria-checked', limState === 'ours')
    limSw.disabled = limState === 'other'
    limSub.textContent = limState === 'other' ? 'You already have your own Claude status line, so this stays off'
      : '5-hour and weekly use, read from Claude Code in a terminal (the desktop app doesn\'t report it)'
  }
  limSw.onclick = async () => {
    const res = await notch.invoke('setup-limits', limState !== 'ours')
    if (res.error) { err.textContent = res.error; layout(); return }
    limState = res.agents.limits; paintLim(); tick(limState === 'ours')
  }
  paintLim()
  limBody.append(el('b', '', 'Claude usage limits'), limSub)
  lim.append(limBody, limSw)
  // Approve from your phone: a web page on your Wi-Fi, opened by scanning the QR code. Off until you switch it on.
  const ph = el('div', 'srow'), phBody = el('div', 'sbody'), phSub = el('span', 'sub'), pair = el('div', 'pairing')
  const phSw = el('button', 'switch'); phSw.append(el('span', 'knob')); phSw.setAttribute('role', 'switch')
  const paintPhone = info => {
    phSw.classList.toggle('on', info.enabled); phSw.setAttribute('aria-checked', info.enabled)
    phSub.className = 'sub' + (info.enabled && !info.error ? ' on' : '')
    phSub.textContent = !info.enabled ? 'Allow or deny requests from your phone, on your Wi-Fi'
      : info.error || 'On · scan the code with your phone camera'
    pair.hidden = !info.enabled || !!info.error
    if (!pair.hidden) {
      const img = el('img'), how = el('div', 'how'), again = el('button', '', 'New link')
      img.src = info.qr; img.alt = 'QR code to pair your phone'
      again.title = 'Replace the link: phones paired before stop working'
      again.onclick = async () => { paintPhone(await notch.invoke('phone-renew')); tick(true) }
      how.append(el('span', '', 'Same Wi-Fi as this PC. Anyone with this link can approve requests, so keep it to yourself.'), el('code', '', info.url), again)
      pair.replaceChildren(img, how)
    }
    layout()
  }
  phSw.onclick = async () => { const info = await notch.invoke('phone-set', !phSw.classList.contains('on')); paintPhone(info); tick(info.enabled) }
  phBody.append(el('b', '', 'Approve from your phone'), phSub)
  ph.append(phBody, phSw)
  pair.hidden = true
  notch.invoke('phone-info').then(paintPhone)
  const tip = el('div', 'srow'), tbody = el('div', 'sbody')
  tbody.append(el('b', '', 'Ctrl + Alt + N'), el('span', 'sub', 'Opens Notch from anywhere. The ⓘ button lists every shortcut.'))
  tip.append(tbody)
  const idle = el('div', 'srow'), idleBody = el('div', 'sbody'), idleSw = el('button', 'switch' + (idleAnim ? ' on' : ''))
  idleSw.append(el('span', 'knob')); idleSw.setAttribute('role', 'switch'); idleSw.setAttribute('aria-checked', idleAnim)
  idleSw.onclick = () => {
    idleAnim = !idleAnim; try { localStorage.setItem('idleAnim', idleAnim ? 'on' : 'off') } catch {}
    idleSw.classList.toggle('on', idleAnim); idleSw.setAttribute('aria-checked', idleAnim); tick(idleAnim)
    if (!idleAnim) stopVenom()
  }
  idleBody.append(el('b', '', 'Idle animations'), el('span', 'sub', 'Eyes, moods, and a little mischief when it is quiet'))
  idle.append(idleBody, idleSw)
  // Updates: what version this is, whether a newer one is on the way, and whether to look automatically
  const upRow = el('div', 'srow'), upBody = el('div', 'sbody'), upSub = el('span', 'sub'), upBtn = el('button', 'mini')
  const autoRow = el('div', 'srow'), autoBody = el('div', 'sbody'), autoSw = el('button', 'switch'); autoSw.append(el('span', 'knob')); autoSw.setAttribute('role', 'switch')
  paintUpdate = () => {
    const s = upd, text = { dev: 'Running from source: updates are for the installed app', checking: 'Checking…', current: 'Up to date', downloading: 'Downloading ' + s.next + '…', ready: s.next + ' is ready. Installs when you quit', error: 'Could not check: ' + s.error }[s.status] || 'Looks for a new version every few hours'
    upSub.textContent = text; upSub.className = 'sub' + (s.status === 'ready' ? ' on' : '')
    upBtn.hidden = s.status === 'dev'; upBtn.disabled = s.status === 'checking' || s.status === 'downloading'

  }
  upBtn.onclick = () => upd.status === 'ready' ? notch.send('update-restart') : notch.invoke('update-check')
  autoSw.onclick = async () => { upd = await notch.invoke('update-auto', !upd.auto); paintUpdate(); tick(upd.auto) }
  upBody.append(el('b', '', 'Agent Notch ' + (upd.version || '')), upSub); upRow.append(upBody, upBtn)
  autoBody.append(el('b', '', 'Check for updates automatically'), el('span', 'sub', 'Asks GitHub for a new release. Nothing else leaves your PC')); autoRow.append(autoBody, autoSw)
  paintUpdate()
  prefs.append(lim, ph, pair, login, idle, upRow, autoRow, tip)

  const finish = el('div', 'finish'), doneBtn = el('button', 'go', first ? 'Get started' : 'Done')
  doneBtn.onclick = async () => {
    await notch.invoke('setup-done')
    closeSetup(true)
    if (first) { chime(); showToast({ lead: () => badge(true), title: () => el('b', 'ok', "You're all set"), right: '', line: 'Hover the notch any time' }, 2600) }
  }

  const h2 = t => el('h2', '', t)
  const wrap = el('div', 'setup help'); wrap.append(head, intro, h2('Agents'), agents, h2('Preferences'), prefs, err, finish)
  panel.replaceChildren(wrap)
  if (open) { anim(panel, [{ opacity: 0, filter: 'blur(5px)' }, { opacity: 1, filter: 'blur(0px)' }], { duration: 320 }); layout() } else setOpen(true)

function switchEl(label, get, put, title) {
